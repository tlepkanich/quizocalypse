<title>Quiz Builder — Build</title>
<style>
:root{
  --accent:#6D5AE6; --accent-2:#6B4FD8; --accent-ink:#3C3489;
  --accent-wash:#EDEBFC; --accent-tint:#F3F1FD;
  --ink:#2E2740; --ink-3:#5A5470; --ink-4:#7C7791; --ink-25:#B6B0C8;
  --rule:#E9E7EF; --rule-2:#F1EFF6; --cream-2:#F2F1F5;
  --ok:#158A5A; --ok-wash:#E4F3EB; --danger:#C1362B; --danger-wash:#FBEEEC;
  --backdrop:#EDECF1; --pane:#FBFAFC;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  /* merchant brand (fixed — inherited from the store; NOT edited on the Build tab) */
  --brand:#0E7C6B; --b-bg:#FCFBF8; --b-card:#fff; --b-ink:#211D17; --b-dim:#6E7368; --b-line:#EAE7E0;
  /* desktop content sizing (research-derived: text ~640, grid ~768 -> single aligned 700; tile height cap kills giant images) */
  --qz-cmax:700px; --qz-tile-max-h:200px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--backdrop); font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased;
  padding:16px 0 40px;}
.wrap{max-width:1320px; margin:0 auto; padding:0 16px;}
.app{background:#fff; border:1px solid var(--rule); border-radius:16px; overflow:hidden;
  box-shadow:0 12px 40px rgba(120,110,150,.14); display:flex; flex-direction:column;
  height:calc(100vh - 32px); max-height:960px;}
button{font-family:inherit; cursor:pointer}
svg.i{width:17px;height:17px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none;}
.mono{font-family:var(--mono)}
.badge-soon{font:700 7.5px var(--mono); letter-spacing:.05em; text-transform:uppercase; color:var(--ink-25);
  border:1px solid var(--rule); border-radius:4px; padding:1px 4px; margin-left:5px; vertical-align:middle;}

/* ---------- top bar ---------- */
.top{display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--rule);}
.brandmark{width:26px;height:26px;border-radius:7px; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:800; font-size:14px;}
.qtitle{font-weight:600; font-size:13.5px; letter-spacing:-.01em;}
.tbadge{font:600 10px var(--sans); color:var(--ink-4); background:var(--cream-2); padding:3px 8px; border-radius:999px;}
.tbadge.dec{color:var(--accent-ink); background:var(--accent-wash);}
.sp{flex:1}
.modeseg,.devseg{display:inline-flex; background:var(--cream-2); border-radius:9px; padding:3px; gap:2px;}
.modeseg button,.devseg button{border:none; background:transparent; color:var(--ink-4); font:600 12px var(--sans);
  padding:6px 12px; border-radius:7px; display:inline-flex; align-items:center; gap:5px;}
.modeseg button.on,.devseg button.on{background:#fff; color:var(--accent-ink); box-shadow:0 1px 2px rgba(109,90,230,.12);}
.iconbtn{width:32px;height:32px; border:1px solid var(--rule); background:#fff; border-radius:8px; display:grid; place-items:center; color:var(--ink-3);}
.iconbtn:hover:not(:disabled){background:var(--cream-2)}
.iconbtn:disabled{opacity:.4; cursor:default}
.tbtn{border:1px solid var(--rule); background:#fff; color:var(--ink-3); font:600 12px var(--sans); padding:7px 12px; border-radius:8px; display:inline-flex; gap:6px; align-items:center;}
.tbtn:hover{background:var(--cream-2)}
.tbtn.primary{border:none; background:var(--accent); color:#fff;}
.tbtn.primary:hover{background:var(--accent-2)}
.tbtn.assist{color:var(--accent-ink); border-color:var(--accent-wash); background:var(--accent-tint);}
.topdiv{width:1px; height:20px; background:var(--rule); flex:none; margin:0 3px;}

/* ---------- body ---------- */
.body{display:grid; grid-template-columns:60px 244px minmax(320px,1fr) 320px; flex:1; min-height:0; overflow:hidden;}
.body.previewing{grid-template-columns:60px 1fr}
.body.previewing .lib, .body.previewing .insp{display:none}
/* rail */
.rail{border-right:1px solid var(--rule-2); padding:9px 6px; display:flex; flex-direction:column; gap:2px;}
.railitem{border:none; background:transparent; border-radius:10px; padding:8px 3px 6px; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--ink-4); position:relative;}
.railitem span{font:600 8.5px var(--sans);}
.railitem svg{width:19px;height:19px}
.railitem:hover{background:#FBFAFD; color:var(--ink-3)}
.railitem.on{background:var(--accent-tint); color:var(--accent-ink)}
.railitem.on::before{content:''; position:absolute; left:-6px; top:7px; bottom:7px; width:3px; border-radius:0 3px 3px 0; background:var(--accent);}

/* library */
.lib{border-right:1px solid var(--rule-2); display:flex; flex-direction:column; min-width:0;}
.libhd{padding:11px 12px 9px; border-bottom:1px solid var(--rule-2);}
.libtabs{display:flex; gap:2px; background:var(--cream-2); border-radius:8px; padding:3px; margin-bottom:9px;}
.libtabs button{flex:1; border:none; background:transparent; color:var(--ink-4); font:600 11.5px var(--sans); padding:5px; border-radius:6px;}
.libtabs button.on{background:#fff; color:var(--accent-ink); box-shadow:0 1px 2px rgba(109,90,230,.1);}
.search{position:relative}
.search svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); width:14px;height:14px; color:var(--ink-25)}
.search input{width:100%; border:1px solid var(--rule); border-radius:8px; padding:7px 9px 7px 28px; font:500 12px var(--sans); color:var(--ink);}
.search input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-wash);}
.libbody{overflow-y:auto; padding:9px 11px 14px; display:flex; flex-direction:column; gap:10px; flex:1; min-height:0;}
.libgroup > .gl{font:700 8.5px var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--ink-25); margin-bottom:6px; display:block;}
.libgrid{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.comp{border:1px solid var(--rule); border-radius:8px; background:#fff; padding:8px 7px; display:flex; align-items:center; gap:7px; color:var(--ink-3); text-align:left; cursor:pointer; transition:border-color .1s, box-shadow .1s;}
.comp:hover{border-color:var(--accent); box-shadow:0 2px 8px rgba(109,90,230,.12); color:var(--accent-ink);}
.comp svg{width:15px;height:15px; color:var(--ink-4)}
.comp:hover svg{color:var(--accent)}
.comp span{font:600 11px var(--sans); line-height:1.1}
.emptyhint{font-size:11px; color:var(--ink-4); text-align:center; padding:12px}

/* ---------- canvas ---------- */
.stagewrap{background:var(--pane); display:flex; flex-direction:column; min-width:0;}
.stagebar{display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--rule-2); font-size:11px; color:var(--ink-4);}
.stagebar .zoom{margin-left:auto; display:inline-flex; align-items:center; gap:4px}
.stage{flex:1; overflow:hidden; padding:24px 16px 16px; display:flex; justify-content:center; align-items:flex-start; min-height:440px;}
.devwrap{position:relative; flex:none;}
.device{position:absolute; top:0; left:0; transform-origin:top left; background:var(--b-bg);
  width:var(--dw,390px); height:var(--dh,844px); overflow:hidden; display:flex; flex-direction:column;
  border-radius:46px; box-shadow:0 26px 64px -22px rgba(46,39,64,.42), 0 0 0 1px var(--rule);}
.device.desktop{border-radius:12px; box-shadow:0 26px 64px -22px rgba(46,39,64,.34), 0 0 0 1px var(--rule);}
.dchrome,.dprog{display:none}
.device.desktop .dchrome, .device.desktop .dprog, .device.desktop .fade{display:none}
.screen{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; position:relative; scrollbar-width:none;}
.screen::-webkit-scrollbar{display:none}
.canvas{padding:18px 20px 44px; display:flex; flex-direction:column; min-height:100%; position:relative;}
/* desktop: cap the quiz content column so text/images never balloon on a wide card (research: ~640–768; single aligned 700) */
.device.desktop .canvas{align-items:center;}
.device.desktop .canvas > .blk, .device.desktop .canvas > .ins, .device.desktop .canvas > .addblk{width:100%; max-width:var(--qz-cmax,700px); margin-left:auto; margin-right:auto;}
.fade{position:absolute; left:0; right:0; bottom:0; height:34px; pointer-events:none; z-index:6; background:linear-gradient(transparent,var(--b-bg)); border-radius:0 0 44px 44px;}
/* shopper's close on a pop-up */
.modalx{display:none; position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:9px; border:none; background:rgba(0,0,0,.07); color:var(--b-ink); place-items:center; cursor:pointer; z-index:8;}
.modalx svg{width:16px;height:16px}
/* ---- desktop: the quiz shown the way it's placed (no fake browser); merchant owns the page behind ---- */
.device.desktop.dpop{background:#3a3743; justify-content:center; align-items:center; padding:0;}
.device.desktop.dpop .modalx{display:grid;}
.device.desktop.dpop .screen{flex:none; overflow:hidden; display:flex; flex-direction:column; position:relative;
  width:var(--modw,660px); max-width:calc(100% - 64px); max-height:calc(100% - 64px);
  background:var(--b-bg); border-radius:20px; box-shadow:0 40px 100px rgba(0,0,0,.5);}
.device.desktop.dpop.dpopfull .screen{width:calc(100% - 44px); max-width:none; height:calc(100% - 44px); max-height:none; border-radius:22px;}
.device.desktop.dpop .canvas{flex:1; min-height:0; overflow-y:auto; max-width:none; margin:0; padding:40px var(--dtpad,40px) 40px; scrollbar-width:none;}
.device.desktop.dpop .canvas::-webkit-scrollbar{display:none}
.device.desktop.dinline{background:#EEECF2;}
.device.desktop.dinline .screen{display:flex; align-items:flex-start; justify-content:center; padding:40px 26px;}
.device.desktop.dinline .canvas{width:var(--dtw,860px); max-width:100%; margin:0; padding:var(--dtpad,52px) var(--dtpad,52px) calc(var(--dtpad,52px) + 6px); background:var(--b-bg); border-radius:20px; box-shadow:0 20px 54px -20px rgba(46,39,64,.30), 0 0 0 1px rgba(0,0,0,.03); min-height:0;}
.device.desktop.dfull{background:var(--b-bg);}
.device.desktop.dfull .canvas{max-width:none; margin:0; min-height:100%; padding:48px var(--dtpad,32px) 60px;}
.expandscrim{position:fixed; inset:0; z-index:90; background:rgba(28,24,40,.64); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; padding:44px;}
.expandscrim.on{display:flex}
.expandhost{position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
.expandscrim .closex{position:absolute; top:20px; right:24px; width:40px;height:40px;border-radius:50%; border:none; background:rgba(255,255,255,.16); color:#fff; display:grid; place-items:center; cursor:pointer; z-index:3;}
.expandscrim .closex:hover{background:rgba(255,255,255,.28)}
.expandscrim .closex svg{width:18px;height:18px}
/* template gallery */
.tplscrim{position:fixed; inset:0; z-index:95; background:rgba(28,24,40,.55); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; padding:34px;}
.tplscrim.on{display:flex}
.tplmodal{background:#fff; border-radius:18px; box-shadow:0 40px 90px rgba(28,24,40,.4); width:100%; max-width:840px; max-height:86vh; display:flex; flex-direction:column; overflow:hidden;}
.tm-hd{padding:18px 22px; border-bottom:1px solid var(--rule-2); display:flex; align-items:center; gap:12px;}
.tm-hd h2{margin:0; font-size:17px; font-weight:600;}
.tm-hd p{margin:2px 0 0; font-size:12px; color:var(--ink-4);}
.tm-x{margin-left:auto; width:32px;height:32px;border-radius:8px;border:1px solid var(--rule);background:#fff;color:var(--ink-3);display:grid;place-items:center;cursor:pointer;}
.tplbody{overflow-y:auto; padding:18px 22px 22px;}
.tplgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.tplcard{border:1px solid var(--rule); border-radius:13px; padding:14px; cursor:pointer; background:#fff; text-align:left; display:flex; flex-direction:column; gap:9px; transition:border-color .1s, box-shadow .1s;}
.tplcard:hover{border-color:var(--accent); box-shadow:0 6px 20px rgba(109,90,230,.13);}
.tplcard .tc-top{display:flex; align-items:flex-start; gap:10px;}
.tplcard .tc-ic{width:34px;height:34px;border-radius:9px;background:var(--accent-tint);color:var(--accent-ink);display:grid;place-items:center;flex:none;}
.tplcard .tc-ic svg{width:18px;height:18px}
.tplcard b{font-size:13.5px; font-weight:600; display:block;}
.tplcard .tc-cat{font:600 9px var(--mono); text-transform:uppercase; letter-spacing:.05em; color:var(--ink-25); margin-top:1px; display:block;}
.tplcard .tc-facts{display:flex; flex-wrap:wrap; gap:5px;}
.tplcard .tc-facts span{font:500 10.5px var(--sans); color:var(--ink-3); background:var(--cream-2); border-radius:5px; padding:3px 7px;}
.tplcard .tc-use{align-self:flex-start; font:600 11.5px var(--sans); color:var(--accent-ink);}
.tplscratch{margin-top:14px; border-top:1px solid var(--rule-2); padding-top:14px; display:flex; align-items:center; gap:10px; font-size:12px; color:var(--ink-4);}
.tplscratch button{border:1px solid var(--rule); background:#fff; border-radius:8px; padding:7px 12px; font:600 12px var(--sans); color:var(--ink-3); cursor:pointer;}
.tplscratch button:hover{background:var(--cream-2)}
.stagebar .dl{font:700 8.5px var(--mono); text-transform:uppercase; letter-spacing:.05em; color:var(--ink-25); flex:none;}
.numsl{display:inline-flex; align-items:center; gap:8px;}
.numsl input[type=range]{-webkit-appearance:none;appearance:none;width:92px;height:4px;border-radius:3px;background:var(--rule);outline:none;margin:0;cursor:pointer}
.numsl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:1.5px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.18);cursor:grab}
.numsl input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;background:var(--accent)}
.numsl input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:1.5px solid var(--accent);cursor:grab}
.numin{width:42px; border:1px solid var(--rule); border-radius:7px; padding:4px 4px; font:600 11px var(--mono); color:var(--ink); text-align:center; background:#fff;}
.numin:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-wash);}
.nsl-u{font:600 9px var(--mono); color:var(--ink-25); min-width:11px}
.colorrow{display:inline-flex; align-items:center; gap:8px}
.swatchbtn{width:26px;height:26px;border-radius:8px;border:1px solid var(--rule);padding:0;overflow:hidden;position:relative;cursor:pointer;flex:none;background:#fff}
.swatchbtn input[type=color]{position:absolute;inset:-6px;width:150%;height:150%;border:none;padding:0;cursor:pointer;background:none}
.hexin{width:80px;border:1px solid var(--rule);border-radius:7px;padding:4px 7px;font:600 11px var(--mono);color:var(--ink);text-transform:uppercase;background:#fff}
.hexin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-wash)}
.dprop{display:block}
.mobrow{display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:6px}
.mobtag{margin-right:auto; display:inline-flex; align-items:center; gap:4px; font:700 9px var(--mono); color:var(--ink-4); text-transform:uppercase; letter-spacing:.06em}
.mobtag::before{content:''; width:9px; height:13px; border:1.5px solid var(--ink-25); border-radius:2px; display:inline-block}
.addmob{margin-top:5px; background:none; border:none; color:var(--accent); font:600 11px var(--sans); cursor:pointer; padding:2px 0; display:inline-flex; align-items:center; gap:3px}
.addmob:hover{text-decoration:underline}
.dreset{background:none;border:1px solid var(--rule);border-radius:6px;width:22px;height:22px;color:var(--ink-4);cursor:pointer;font-size:12px;line-height:1;flex:none}
.dreset:hover{border-color:var(--accent);color:var(--accent)}
.mobchip{display:inline-block;margin-left:6px;font:700 7.5px var(--mono);color:var(--accent-ink);background:var(--accent-wash);padding:2px 5px;border-radius:5px;text-transform:uppercase;letter-spacing:.05em;vertical-align:middle}
.rdz{font-size:10.5px;color:var(--ink-4);background:var(--rule-2);border-radius:7px;padding:6px 9px;margin-top:2px;display:flex;gap:6px;align-items:flex-start;line-height:1.35}
.rdz svg{width:12px;height:12px;flex:none;margin-top:1px;color:var(--ink-25)}
.deeplink{display:flex;align-items:center;gap:7px;width:100%;background:var(--rule-2);border:1px solid var(--rule);border-radius:9px;padding:9px 11px;font:600 12px var(--sans);color:var(--ink-3);cursor:pointer;text-align:left;margin-top:2px}
.deeplink:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-tint)}
.deeplink .dlarrow{margin-left:auto;color:var(--ink-25)}
.deeplink:hover .dlarrow{color:var(--accent)}
.libtabs button{font-size:10.5px; padding:5px 2px}
.bgpanel{padding:12px 13px}
.bgphd{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.bgphd .gl{margin:0}
.bgscreen{font:700 8.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--accent-ink);background:var(--accent-wash);padding:3px 7px;border-radius:6px}
.quadgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 10px;max-width:118px}
.quadgrid .qsw{width:100%;height:38px;border-radius:8px}
/* hideable left panel */
.lib{position:relative;}
.libcollapse{position:absolute; top:9px; right:8px; z-index:6; width:22px;height:22px;border:1px solid var(--rule);background:#fff;border-radius:6px;color:var(--ink-4);display:grid;place-items:center;cursor:pointer;}
.libcollapse:hover{background:var(--cream-2);color:var(--ink-3)}
.libcollapse svg{width:13px;height:13px;transform:rotate(90deg)}
.stagewrap{position:relative;}
.libshow{position:absolute; top:11px; left:12px; z-index:7; display:none; align-items:center; gap:5px; border:1px solid var(--rule); background:#fff; border-radius:8px; padding:5px 10px 5px 7px; font:600 11px var(--sans); color:var(--ink-3); cursor:pointer; box-shadow:0 2px 8px rgba(46,39,64,.08)}
.libshow svg{width:13px;height:13px;transform:rotate(-90deg)}
.libshow:hover{background:var(--cream-2)}
.body:not(.previewing).libhidden{grid-template-columns:60px 0 minmax(320px,1fr) 320px}
.body:not(.previewing).libhidden .lib{overflow:hidden; border-right:none;}
.body:not(.previewing).libhidden .libshow{display:inline-flex}
/* native inline add-block */
.addblk{margin:8px auto 0; display:flex;align-items:center;justify-content:center;gap:7px; border:1.5px dashed var(--b-line); background:transparent; color:var(--b-dim); border-radius:12px; padding:12px; font:600 13px var(--sans); cursor:pointer; width:100%;}
.addblk svg{width:15px;height:15px}
.addblk:hover{border-color:var(--brand); color:var(--brand); background:color-mix(in srgb,var(--brand) 5%,transparent)}
.raildiv{font:700 8px var(--mono); letter-spacing:.1em; color:var(--ink-25); text-transform:uppercase; padding:12px 0 5px; text-align:center; border-top:1px solid var(--rule-2); margin:6px 10px 2px}
.savedpill{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--sans);color:var(--ink-4);padding:0 2px;white-space:nowrap}
.savedpill svg{width:13px;height:13px;color:#0E9E80}
@media (max-width:1140px){ .tplgrid{grid-template-columns:1fr} }

/* blocks */
.blk{position:relative;}
.blk .grip{position:absolute; left:-16px; top:2px; width:16px; height:22px; border-radius:5px; display:none;
  align-items:center; justify-content:center; color:var(--ink-25); cursor:grab; background:transparent;}
.blk .grip svg{width:13px;height:13px}
.blk:hover .grip{display:flex}
.blk .grip:hover{color:var(--ink-4); background:var(--cream-2)}
.editing .blk .grip{display:none}
.blkinner{border-radius:9px; outline:2px solid transparent; outline-offset:3px; transition:outline-color .12s; position:relative;}
.blk.sel .blkinner{outline-color:var(--accent);}
.blk.sel .grip{display:flex; color:var(--accent)}
.blkinner:hover{outline-color:var(--accent-wash);}
.blk.sel .blkinner:hover{outline-color:var(--accent);}
.editing .blkinner:hover, .editing .blk.sel .blkinner{outline-color:transparent;}
[contenteditable]{outline:none;}
[contenteditable]:focus{background:var(--accent-tint); border-radius:4px; box-shadow:0 0 0 3px var(--accent-tint);}
.device.desktop [contenteditable]:focus{background:rgba(109,90,230,.06)}

/* insert point */
.ins{height:8px; position:relative; display:flex; align-items:center; justify-content:center;}
.ins .insline{position:absolute; left:0; right:0; height:2px; background:var(--accent); border-radius:2px; opacity:0; transition:opacity .1s;}
.ins .insadd{width:20px;height:20px;border-radius:50%; background:#fff; border:1.5px solid var(--accent); color:var(--accent); display:grid; place-items:center; opacity:0; transform:scale(.7); transition:opacity .1s, transform .1s; z-index:3; box-shadow:0 1px 4px rgba(60,50,90,.18)}
.ins .insadd svg{width:13px;height:13px; stroke-width:2.4}
.ins:hover .insline, .ins:hover .insadd{opacity:1; transform:scale(1)}
.editing .ins{pointer-events:none}
.dropline{height:0;}
.dropline.on{height:2px; background:var(--accent); border-radius:2px; margin:3px 0; box-shadow:0 0 0 3px var(--accent-wash)}

/* drag ghost */

// ---------- default block factory ----------
function defBlock(type){

function defWith(type,over){var b=defBlock(type); if(over){for(var k in over){b[k]=over[k];}} return b;}

// ---------- state + history ----------
var doc=seed();
var history=[clone(doc)], hi=0;
function snapshot(){ history=history.slice(0,hi+1); history.push(clone(doc)); hi=history.length-1; if(history.length>60){history.shift();hi--;} updateUndo(); }
function undo(){ if(hi>0){var vt=doc.tab; hi--; doc=clone(history[hi]); doc.tab=vt; doc.selected=null; syncRail(); renderWorkspace(); updateUndo();} }
function redo(){ if(hi<history.length-1){var vt=doc.tab; hi++; doc=clone(history[hi]); doc.tab=vt; doc.selected=null; syncRail(); renderWorkspace(); updateUndo();} }
function syncRail(){ $$('.railitem').forEach(function(r){ if(r.dataset.nav) r.classList.toggle('on', r.dataset.nav===doc.tab); }); }
function updateUndo(){ $('#undo').disabled=hi<=0; $('#redo').disabled=hi>=history.length-1; }

function curStep(){ return doc.steps.filter(function(s){return s.id===doc.currentStep})[0] || doc.steps[0]; }
function curBlocks(){ return curStep().blocks; }
function selBlock(){ var s=curStep(); return s.blocks.filter(function(b){return b.id===doc.selected})[0]||null; }
function blockIndex(id){ return curStep().blocks.map(function(b){return b.id}).indexOf(id); }

function deviceDims(){
  if(doc.device!=='desktop') return {w:390,hh:844};
  var pl=(doc.settings&&doc.settings.placement)||'popup';
  if(pl==='inline'){ var DTW={narrow:640,standard:780,wide:960}; return {w:(DTW[doc.dtWidth]||780)+200, hh:720}; }
  if(pl==='popup'){ var MW={compact:460,standard:600,large:760,full:1000}; var mw=MW[doc.popSize]||600; return {w:(doc.popSize==='full'?1200:mw+180), hh:720}; }
  return {w:1200,hh:760}; // full page: full-bleed page with a capped content column inside
}
function resetPreviewScroll(){ var sc=$('#screen'); if(sc)sc.scrollTop=0; var cv=$('#canvas'); if(cv)cv.scrollTop=0; }
// per-screen background -> CSS (brand inherits; solid/gradient/split/quadrant)
function bgCss(bg){
  if(!bg||!bg.type||bg.type==='brand') return '';
  if(bg.type==='solid') return bg.c1||'#FCFBF8';
  if(bg.type==='gradient') return 'linear-gradient('+(bg.angle!=null?bg.angle:160)+'deg,'+(bg.c1||'#FCFBF8')+','+(bg.c2||'#EDEBFC')+')';
  if(bg.type==='split'){
    var a=bg.a||'#0E7C6B', b=bg.b||'#FCFBF8', pos=(bg.pos!=null?bg.pos:50), soft=(bg.soft||0);
    var dir=bg.orient==='v'?'to bottom':bg.orient==='d'?'135deg':'to right';
    if(soft>0) return 'linear-gradient('+dir+','+a+' calc('+pos+'% - '+(soft/2)+'px),'+b+' calc('+pos+'% + '+(soft/2)+'px))';
    return 'linear-gradient('+dir+','+a+' '+pos+'%,'+b+' '+pos+'%)';
  }
  if(bg.type==='quadrant'){
    var x=(bg.x!=null?bg.x:50), y=(bg.y!=null?bg.y:50);
    var cell=function(c){ c=c||'#EEE'; return 'linear-gradient('+c+','+c+')'; };
    return cell(bg.tl)+' top left / '+x+'% '+y+'% no-repeat,'+
           cell(bg.tr)+' top right / '+(100-x)+'% '+y+'% no-repeat,'+
           cell(bg.bl)+' bottom left / '+x+'% '+(100-y)+'% no-repeat,'+
           cell(bg.br)+' bottom right / '+(100-x)+'% '+(100-y)+'% no-repeat';
  }
  return '';
}
function fitDevice(){
  var frame=$('#frame'), wrap=$('#devwrap'); if(!frame||!wrap) return;
  var box=wrap.parentElement; if(!box || box.clientWidth<20) return; // stage hidden -> skip (avoids scale->0)
  var expanded=box.id==='expandhost';
  var _d=deviceDims(), w=_d.w, hh=_d.hh;
  var padX=expanded?64:44, padY=expanded?64:44, maxUp=expanded?1.6:1;
  // desktop: fit to WIDTH only, top-anchored, never upscale -> switching formats no longer re-centers/drops the preview.
  // mobile: fit both axes so the whole phone is visible.
  var fit = (doc.device==='desktop')
    ? Math.min(maxUp,(box.clientWidth-padX)/w)
    : Math.min(maxUp,(box.clientWidth-padX)/w,(box.clientHeight-padY)/hh);
  var s=Math.max(0.2, Math.min(2, fit*((doc.zoom||100)/100)));
  frame.style.transformOrigin='top left';
  frame.style.transform='scale('+s.toFixed(3)+')';
  wrap.style.width=(w*s)+'px'; wrap.style.height=(hh*s)+'px';
  var zl=$('#zlabel'); if(zl) zl.textContent=Math.round(s*100)+'%';
}
function openExpand(){ $('#expandhost').appendChild($('#devwrap')); $('#expandscrim').classList.add('on'); setTimeout(fitDevice,0); }
function closeExpand(){ $('#stage').appendChild($('#devwrap')); $('#expandscrim').classList.remove('on'); setTimeout(fitDevice,0); }

function placementClass(){ var pl=(doc.settings&&doc.settings.placement)||'popup'; return pl==='full'?'dfull':pl==='popup'?'dpop':'dinline'; }
function renderStageBar(){
  var el=$('#dtwctl'); if(!el) return;
  if(doc.device!=='desktop'){ el.innerHTML=''; return; }
  var pl=(doc.settings&&doc.settings.placement)||'popup';
  var seg=function(k,opts,cur){ return '<span class="seg" style="padding:2px">'+opts.map(function(o){return '<button class="'+(cur===o[0]?'on':'')+'" data-szk="'+k+'" data-szv="'+o[0]+'" style="padding:4px 9px;font-size:11px">'+o[1]+'</button>';}).join('')+'</span>'; };
  var html='<span class="dl">Show as</span><span class="seg" style="padding:2px">'+
    [['popup','Pop-up'],['inline','Inline'],['full','Full page']].map(function(o){return '<button class="'+(pl===o[0]?'on':'')+'" data-plc="'+o[0]+'" style="padding:4px 9px;font-size:11px">'+o[1]+'</button>';}).join('')+'</span>';
  if(pl==='popup'){ html+='<span class="dl">Size</span>'+seg('pop',[['compact','S'],['standard','M'],['large','L'],['full','Full']],doc.popSize); }
  else if(pl==='inline'){ html+='<span class="dl">Width</span>'+seg('dtw',[['narrow','S'],['standard','M'],['wide','L']],doc.dtWidth); }
  var pv=(doc.settings.dtPad||40);
  html+='<span class="dl">Side padding</span><span class="numsl"><input type="range" min="16" max="64" step="2" value="'+pv+'" data-pad><input class="numin" value="'+pv+'" data-padnum></span>';
  el.innerHTML=html;
  $$('[data-plc]',el).forEach(function(b){ b.onclick=function(){ doc.settings.placement=b.dataset.plc; snapshot(); renderCanvas(); resetPreviewScroll(); }; });
  $$('[data-szv]',el).forEach(function(b){ b.onclick=function(){ if(b.dataset.szk==='pop')doc.popSize=b.dataset.szv; else doc.dtWidth=b.dataset.szv; snapshot(); renderCanvas(); }; });
  var pad=$('[data-pad]',el), padn=$('[data-padnum]',el);
  function setPad(v){ doc.settings.dtPad=v; var f=$('#frame'); if(f) f.style.setProperty('--dtpad',v+'px'); }
  if(pad) pad.oninput=function(){ var v=+pad.value; if(padn)padn.value=v; setPad(v); };
  if(pad) pad.onchange=function(){ snapshot(); };
  if(padn) padn.onchange=function(){ var v=Math.max(16,Math.min(64,parseInt(padn.value,10)||40)); padn.value=v; if(pad)pad.value=v; setPad(v); snapshot(); };
}
function renderCanvas(){
  var frame=$('#frame'); var desk=doc.device==='desktop';
  var pl=(doc.settings&&doc.settings.placement)||'popup'; var plc=placementClass();
  frame.className='device'+(desk?(' desktop '+plc):'')+(desk&&pl==='popup'&&doc.popSize==='full'?' dpopfull':'');
  if(desk){
    frame.style.setProperty('--dtpad',((doc.settings&&doc.settings.dtPad)||40)+'px');
    if(pl==='popup'){ var MW={compact:460,standard:600,large:760,full:1000}; frame.style.setProperty('--modw',(MW[doc.popSize]||600)+'px'); }
    else if(pl==='inline'){ var DTW={narrow:640,standard:780,wide:960}; frame.style.setProperty('--dtw',(DTW[doc.dtWidth]||780)+'px'); }
  }
  renderStageBar();
  var _d=deviceDims(), w=_d.w, hh=_d.hh;
  frame.style.setProperty('--dw',w+'px'); frame.style.setProperty('--dh',hh+'px');
  var cv=$('#canvas'); cv.innerHTML='';
  cv.style.background = bgCss(curStep()&&curStep().bg);
  $('#app').classList.toggle('previewing', doc.mode==='preview');
  var blocks=curBlocks();
  if(!blocks.length){ cv.appendChild(emptyState()); }
  else {
    if(doc.mode==='edit') cv.appendChild(insertPoint(0));
    blocks.forEach(function(b,i){ cv.appendChild(blockEl(b,i)); if(doc.mode==='edit') cv.appendChild(insertPoint(i+1)); });
    if(doc.mode==='edit'){ var ab=document.createElement('button'); ab.className='addblk'; ab.innerHTML='<svg class="i"><use href="#i-plus"/></svg>Add block'; ab.onclick=function(e){ e.stopPropagation(); openAddPop(ab, blocks.length); }; cv.appendChild(ab); }
  }
  if(doc._lastStep!==doc.currentStep){ var sc=$('#screen'); if(sc)sc.scrollTop=0; doc._lastStep=doc.currentStep; }
  fitDevice();
}

function insertPoint(idx){
  var d=document.createElement('div'); d.className='ins'; d.dataset.idx=idx;
  d.innerHTML='<span class="insline"></span><button class="insadd" aria-label="Add block here"><svg class="i"><use href="#i-plus"/></svg></button>';
  $('.insadd',d).onclick=function(e){ e.stopPropagation(); openAddPop(e.currentTarget, idx); };
  return d;
}

function blockEl(b,i){
  var wrap=document.createElement('div'); wrap.className='blk'+(b.id===doc.selected?' sel':''); wrap.dataset.id=b.id;
  var grip=document.createElement('div'); grip.className='grip'; grip.title='Drag to reorder · click for options';
  grip.innerHTML='<svg class="i"><use href="#i-grip"/></svg>';
  grip.addEventListener('pointerdown',function(e){ startDrag(e,b.id); });
  grip.addEventListener('click',function(e){ e.stopPropagation(); selectSoft(b.id); openBlockMenu(grip,b.id); });
  var inner=document.createElement('div'); inner.className='blkinner';
  inner.style.marginTop=spTop(b)+'px';
  inner.style.marginBottom=spBot(b)+'px';
  inner.innerHTML=renderBlockBody(b);
  inner.addEventListener('click',function(e){
    if(doc.mode==='preview'){ handlePreviewClick(b,e); return; }
    if(e.target.closest('[contenteditable]')) { return; }
    selectHard(b.id);
  });
  wireInline(inner,b);
  if(doc.mode==='edit') wrap.appendChild(grip);
  wrap.appendChild(inner);
  return wrap;
}

function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderBlockBody(b){
  var ed=doc.mode==='edit';
  var cet=function(field,val,cls,tag){ tag=tag||'div';
    return '<'+tag+' class="'+cls+'" '+(ed?'contenteditable="true" spellcheck="false"':'')+' data-field="'+field+'">'+esc(val)+'</'+tag+'>'; };
  switch(b.type){
    case 'heading':
      var hfs=dev(b.style.fontSize,b.style.fontSize_m)||(b.style.size==='s'?18:b.style.size==='m'?23:b.style.size==='xl'?34:28);
      var hcss='font-size:'+hfs+'px;'+(b.style.ls!=null?'letter-spacing:'+b.style.ls+'px;':'')+(b.style.align?'text-align:'+b.style.align+';':'')+(b.style.color?'color:'+b.style.color+';':'')+(b.style.maxW&&b.style.maxW<900?'max-width:'+b.style.maxW+'px;margin-left:auto;margin-right:auto;':'');
      return cet('text', b.text, 'r-head', 'h2').replace('class="r-head"','class="r-head" style="'+hcss+'"');
    case 'text':
      var tfs=dev(b.style.fontSize,b.style.fontSize_m);
      var tcss=(tfs?'font-size:'+tfs+'px;':'')+(b.style.align?'text-align:'+b.style.align+';':'')+(b.style.color?'color:'+b.style.color+';':'')+(b.style.ls!=null?'letter-spacing:'+b.style.ls+'px;':'')+(b.style.maxW&&b.style.maxW<900?'max-width:'+b.style.maxW+'px;margin-left:auto;margin-right:auto;':'');
      return cet('text', b.text, 'r-text', 'p').replace('class="r-text"','class="r-text" style="'+tcss+'"');
    case 'image': return imageBody(b);
    case 'video': return '<div class="r-img" style="aspect-ratio:16/9"><span class="ph">▶</span></div>';
    case 'logo':
      var lw=LOGOSIZE[b.size||'m'];
      return '<div style="text-align:center">'+(b.src?'<img src="'+b.src+'" style="height:'+(lw*0.5)+'px;object-fit:contain">':'<span style="display:inline-block;font-family:Georgia,serif;font-weight:700;color:var(--brand);font-size:'+(lw*0.16+8)+'px;letter-spacing:.02em">SNOWLINE</span>')+'</div>';
    case 'divider': return '<hr class="r-divider" style="height:'+(b.thickness||1)+'px; background:'+(b.dcolor||'var(--b-line)')+'">';
    case 'spacer': var sh=(b.h!=null?b.h:SPACERH[b.size||'md']); return '<div style="height:'+sh+'px; border-radius:6px; background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(109,90,230,.06) 5px,rgba(109,90,230,.06) 10px);'+(ed?'':'background:none')+'"></div>';
    case 'choice': return choiceBody(b);
    case 'scale': return scaleBody(b);
    case 'email': return emailBody(b);
    case 'consent': return '<label class="r-consent"><i></i>'+cet('text',b.text,'','span')+'</label>';
    case 'result': return resultBody(b);
    case 'testimonial': return testimonialBody(b);
    case 'reviewstars': return reviewstarsBody(b);
    case 'trust': return trustBody(b);
    case 'coupon': return couponBody(b);
    case 'shorttext': return shorttextBody(b);
    case 'button':
      return '<div style="text-align:'+((b.style&&b.style.align)||'center')+'">'+cet('label',b.label,'r-btn','span').replace('class="r-btn"','class="r-btn" style="'+btnStyleCss(b)+'"')+'</div>';
    case 'progress': return progressBody(b);
  }
  return '';
}

function imageBody(b){
  var maxw=(b.imgW!=null? b.imgW+'%' : (b.size==='full'?'100%':IMGSIZE[b.size||'full']+'px'));
  var r=(b.radius!=null?b.radius:12);
  var style='aspect-ratio:'+(b.aspect||'4/3')+'; max-width:'+maxw+'; margin:0 auto; border-radius:'+r+'px;';
  var inner = b.src ? '<img src="'+b.src+'" alt="'+esc(b.alt||'')+'" style="object-fit:'+(b.fit||'cover')+'; object-position:'+(b.focal?b.focal.x:50)+'% '+(b.focal?b.focal.y:50)+'%">' : '<span class="ph">🖼</span>';
  var focal = (doc.mode==='edit' && b.src && b.id===doc.selected && (b.fit||'cover')==='cover') ? '<span class="focaldot" data-focal style="left:'+(b.focal?b.focal.x:50)+'%;top:'+(b.focal?b.focal.y:50)+'%"></span>' : '';
  return '<div class="r-img" data-imgframe style="'+style+'">'+inner+focal+'</div>';
}

function choiceBody(b){
  var d=b.display||{mode:'list',columns:2};
  var cls='answers '+d.mode;
  var cols=dev(d.columns,d.columns_m)||1;
  var multiCol=(d.mode==='cards'||d.mode==='tiles'||(d.mode==='list'&&cols>1));
  var gridCss = multiCol ? 'display:grid;grid-template-columns:repeat('+(cols||2)+',1fr);' : '';
  var gapCss = d.spacing!=null ? 'gap:'+d.spacing+'px;' : '';
  var contStyle = (gridCss||gapCss) ? ' style="'+gridCss+gapCss+'"' : '';
  var eyebrow = b.selection==='multi' ? '<div class="r-eyebrow" style="margin-bottom:6px">Select up to '+b.maxSel+'</div>' : '';
  var ed=doc.mode==='edit';
  var sc=d.sc||'#0E7C6B';
  // per-option base style from the design controls (only when set, so CSS defaults hold otherwise)
  var os='';
  if(d.radius!=null) os+='border-radius:'+d.radius+'px;';
  if(d.pad!=null && d.mode!=='pills') os+='padding:'+d.pad+'px '+(d.pad+2)+'px;';
  if(d.bw!=null) os+='border-width:'+d.bw+'px;';
  if(d.bc) os+='border-color:'+d.bc+';';
  if(d.bg) os+='background:'+d.bg+';';
  if(d.lc) os+='color:'+d.lc+';';
  var opts=b.answers.map(function(a,idx){
    var on=(idx===0&&(b.selection!=='multi'||doc.mode==='edit'));
    var showMedia = d.mode==='cards'||d.mode==='tiles'||(d.mode==='list'&&a.media);
    var mediaHtml = showMedia ? '<span class="om">'+answerMedia(a)+'</span>' : '';
    var lbl='<span class="olabel" '+(ed?'contenteditable="true" spellcheck="false" data-ans="'+a.id+'"':'')+'>'+esc(a.label)+'</span>';
    var s=os, si=d.si||'ring', check='';
    if(on){ s+='border-color:'+sc+';';
      if(si==='ring') s+='box-shadow:0 0 0 3px color-mix(in srgb,'+sc+' 22%,transparent);';
      else if(si==='fill') s+='background:color-mix(in srgb,'+sc+' 12%,#fff);';
      else if(si==='check') check='<span style="margin-left:auto;color:'+sc+';font-weight:700;font-size:14px;line-height:1">✓</span>';
    }
    return '<div class="opt'+(on?' on':'')+'" data-optid="'+a.id+'"'+(s?' style="'+s+'"':'')+'>'+mediaHtml+lbl+check+'</div>';
  }).join('');
  return eyebrow+'<div class="'+cls+'"'+contStyle+'>'+opts+'</div>';
}
function answerMedia(a){
  if(!a.media) return '<svg class="i" style="width:18px;height:18px;stroke:var(--b-dim);opacity:.4"><use href="#i-image"/></svg>';
  if(a.media.type==='emoji') return a.media.val;
  if(a.media.type==='icon') return '<svg class="i" style="width:18px;height:18px;stroke:var(--brand)"><use href="#'+a.media.val+'"/></svg>';
  if(a.media.type==='img') return '<img src="'+a.media.val+'">';
  return '';
}

function scaleBody(b){
  var dots='';for(var i=1;i<=b.scaleMax;i++){dots+='<button style="flex:1;aspect-ratio:1;border:1.5px solid var(--b-line);border-radius:10px;background:var(--b-card);color:var(--b-ink);font-weight:600;font-size:13px;cursor:'+(doc.mode==='preview'?'pointer':'default')+'">'+i+'</button>';}
  var ed=doc.mode==='edit';
  var q=ed?'<h2 class="r-head" contenteditable="true" spellcheck="false" data-field="question" style="font-size:22px;margin-bottom:12px">'+esc(b.question)+'</h2>':'<h2 class="r-head" style="font-size:22px;margin-bottom:12px">'+esc(b.question)+'</h2>';
  return q+'<div style="display:flex;gap:7px">'+dots+'</div><div style="display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--b-dim)"><span>'+esc(b.lowLabel)+'</span><span>'+esc(b.highLabel)+'</span></div>';
}

function emailBody(b){
  var ed=doc.mode==='edit';
  var h=ed?'<h2 class="r-head" contenteditable="true" spellcheck="false" data-field="heading" style="font-size:21px;margin-bottom:12px;text-align:center">'+esc(b.heading)+'</h2>':'<h2 class="r-head" style="font-size:21px;margin-bottom:12px;text-align:center">'+esc(b.heading)+'</h2>';
  return h+'<div class="r-emailform"><input placeholder="'+esc(b.placeholder)+'" readonly>'+
    (b.chSms?'<input placeholder="Phone (optional)" readonly>':'')+
    (b.discountUnlock?'<div style="text-align:center;font-size:11.5px;color:var(--brand);font-weight:600">Unlock '+esc(doc.settings.discountValue||'15')+'% off with your results</div>':'')+
    (b.consent?'<label class="r-consent"><i></i>I agree to receive marketing emails. Unsubscribe anytime.</label>':'')+
    '<span class="r-btn" style="width:100%">See my results</span>'+
    (b.skip?'<div style="text-align:center;font-size:11px;color:var(--b-dim)">Skip for now</div>':'')+'</div>';
}

function testimonialBody(b){
  var st=b.style||{}, al=st.align||'left', r=(b.radius!=null?b.radius:14), big=(b.tvariant==='quote');
  var stars=(b.showStars!==false)?'<div style="display:flex;gap:2px;color:'+(b.starColor||'#F5A623')+';margin-bottom:8px;justify-content:'+(al==='center'?'center':'flex-start')+'">'+[0,0,0,0,0].map(function(){return '<svg class="i" style="width:14px;height:14px;stroke:none;fill:currentColor"><use href="#i-star"/></svg>';}).join('')+'</div>':'';
  var avatar=(b.showAvatar!==false)?'<span style="width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--brand) 16%,#fff);display:inline-grid;place-items:center;font-weight:700;color:var(--brand);font-size:14px;flex:none">'+esc((b.author||'★').slice(0,1))+'</span>':'';
  var who='<div style="display:flex;align-items:center;gap:9px;margin-top:11px;justify-content:'+(al==='center'?'center':'flex-start')+'">'+avatar+'<div style="text-align:left"><div style="font-weight:700;font-size:12px;color:var(--b-ink)">'+esc(b.author||'')+'</div><div style="font-size:10.5px;color:var(--b-dim)">'+esc(b.role||'')+'</div></div></div>';
  var inner=stars+'<div style="'+(big?'font-family:Georgia,serif;font-size:19px;line-height:1.35':'font-size:14px;line-height:1.5')+';color:var(--b-ink);text-align:'+al+'">'+(big?'“':'')+esc(b.quote||'')+(big?'”':'')+'</div>'+who;
  if(b.tvariant==='plain') return '<div style="text-align:'+al+'">'+inner+'</div>';
  var card=big?'border-left:3px solid var(--brand);padding:2px 0 2px 16px':'background:var(--b-card);border:1px solid var(--b-line);border-radius:'+r+'px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)';
  return '<div style="'+card+'">'+inner+'</div>';
}
function reviewstarsBody(b){
  var al=(b.style&&b.style.align)||'center', sz=b.starSize||18, col=b.starColor||'#F5A623', full=Math.round(b.rating!=null?b.rating:4.8);
  var stars='';for(var i=1;i<=5;i++)stars+='<svg class="i" style="width:'+sz+'px;height:'+sz+'px;stroke:none;fill:'+(i<=full?col:'var(--b-line)')+'"><use href="#i-star"/></svg>';
  var count=(b.showCount!==false)?'<span style="font-size:12px;color:var(--b-dim);font-weight:600">'+esc(b.count||'')+'</span>':'';
  return '<div style="display:flex;align-items:center;gap:9px;justify-content:'+(al==='center'?'center':al==='right'?'flex-end':'flex-start')+'"><span style="display:flex;gap:2px">'+stars+'</span>'+count+'</div>';
}
function trustBody(b){
  var cols=dev(b.cols,b.cols_m)||3, sz=b.iconSize||26, col=b.iconColor||'#0E7C6B';
  var items=(b.items||[]).map(function(it){ return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center"><svg class="i" style="width:'+sz+'px;height:'+sz+'px;color:'+col+'"><use href="#'+(it.icon||'i-check2')+'"/></svg><span style="font-size:10.5px;color:var(--b-ink);font-weight:600;line-height:1.25">'+esc(it.label)+'</span></div>'; }).join('');
  return '<div style="display:grid;grid-template-columns:repeat('+cols+',1fr);gap:12px;align-items:start">'+items+'</div>';
}
function couponBody(b){
  var r=(b.radius!=null?b.radius:12), col=b.cpColor||'#0E7C6B', solid=(b.cvariant==='solid');
  var frame=solid?'background:'+col+';color:#fff':(b.cvariant==='soft')?'background:color-mix(in srgb,'+col+' 12%,#fff);color:var(--b-ink);border:1px solid color-mix(in srgb,'+col+' 30%,#fff)':'background:var(--b-card);color:var(--b-ink);border:2px dashed '+col;
  var copy=(b.showCopy!==false)?'<span style="font-size:11px;font-weight:700;border:1px solid currentColor;border-radius:7px;padding:5px 10px;opacity:.8">Copy</span>':'';
  return '<div style="'+frame+';border-radius:'+r+'px;padding:14px 16px;text-align:center">'+
    '<div style="font-size:12px;font-weight:600;opacity:.85;margin-bottom:6px">'+esc(b.headline||'')+'</div>'+

// ---------- inline editing ----------
function wireInline(root,b){
  $$('[contenteditable]',root).forEach(function(el){
    var before;
    el.addEventListener('focus',function(){ before=el.textContent; selectSoft(b.id); $('#app').classList.add('editing'); });
    el.addEventListener('input',function(){
      var f=el.dataset.field, ans=el.dataset.ans;
      if(ans){ var a=b.answers.filter(function(x){return x.id===ans})[0]; if(a)a.label=el.textContent; }
      else if(f){ b[f]=el.textContent; }
    });
    el.addEventListener('blur',function(){ $('#app').classList.remove('editing'); if(el.textContent!==before){ snapshot(); renderInspector(); } });
    el.addEventListener('keydown',function(e){ if(e.key==='Enter'&&b.type!=='text'){ e.preventDefault(); el.blur(); } });
  });
  var img=$('[data-imgframe]',root);
  if(img){ img.addEventListener('dblclick',function(){ if(doc.mode==='edit'){ selectSoft(b.id); openMediaPop(img,{kind:'blockimg',blockId:b.id}); } }); }
  var focal=$('[data-focal]',root);
  if(focal) wireFocal(focal,b);
}

function wireFocal(dot,b){
  dot.addEventListener('pointerdown',function(e){
    e.preventDefault(); e.stopPropagation();
    var frame=dot.parentElement; dot.setPointerCapture(e.pointerId);
    function move(ev){
      var r=frame.getBoundingClientRect();
      var x=Math.max(0,Math.min(100,((ev.clientX-r.left)/r.width)*100));
      var y=Math.max(0,Math.min(100,((ev.clientY-r.top)/r.height)*100));
      b.focal={x:Math.round(x),y:Math.round(y)};
      dot.style.left=x+'%'; dot.style.top=y+'%';
      var im=$('img',frame); if(im) im.style.objectPosition=x+'% '+y+'%';
    }
    function up(){ dot.releasePointerCapture(e.pointerId); document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); snapshot(); }
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  });
}

// ---------- drag reorder ----------
var drag=null;
function startDrag(e,id){
  if(doc.mode!=='edit') return;
  e.preventDefault();
  drag={id:id, line:null, moved:false, startY:e.clientY};
  document.addEventListener('pointermove',onDragMove);
  document.addEventListener('pointerup',onDragUp);
}
function onDragMove(e){
  if(!drag) return;
  if(!drag.moved){ if(Math.abs(e.clientY-drag.startY)<4) return; drag.moved=true;
    var w=$('.blk[data-id="'+drag.id+'"]'); if(w) w.classList.add('dragging');
    drag.line=document.createElement('div'); drag.line.className='dropline on'; }
  var cv=$('#canvas'); var blocks=$$('.blk',cv);
  var target=null, before=true;
  for(var i=0;i<blocks.length;i++){
    if(blocks[i].dataset.id===drag.id) continue;
    var r=blocks[i].getBoundingClientRect();
    if(e.clientY < r.top + r.height/2){ target=blocks[i]; before=true; break; }
    target=blocks[i]; before=false;
  }
  if(target){ if(before) target.parentNode.insertBefore(drag.line,target); else target.parentNode.insertBefore(drag.line,target.nextSibling); }
}
function onDragUp(){
  document.removeEventListener('pointermove',onDragMove);
  document.removeEventListener('pointerup',onDragUp);
  if(!drag) return;
  if(!drag.moved){ drag=null; return; }
  var wrap=$('.blk[data-id="'+drag.id+'"]'); if(wrap) wrap.classList.remove('dragging');
  if(drag.line && drag.line.parentNode){
    // compute new index from line position among blocks
    var kids=Array.prototype.slice.call($('#canvas').children);
    var lineIdx=kids.indexOf(drag.line);
    // count blocks before the line
    var newIdx=0;
    for(var i=0;i<lineIdx;i++){ if(kids[i].classList.contains('blk')) newIdx++; }
    var arr=curBlocks(); var from=blockIndex(drag.id);
    var item=arr.splice(from,1)[0];
    if(from<newIdx) newIdx--;
    arr.splice(newIdx,0,item);
    drag.line.remove();
    snapshot(); renderAll();
  }
  drag=null;
}
function startAnswerDrag(e,b){
  e.preventDefault();
  var row=e.target.closest('.arow'); if(!row) return; var aid=row.dataset.aid;
  row.style.opacity='.5';
  function up(ev){ document.removeEventListener('pointerup',up); row.style.opacity='';
    var t=document.elementFromPoint(ev.clientX,ev.clientY); var tr=t&&t.closest?t.closest('.arow'):null;
    if(tr&&tr.dataset.aid&&tr.dataset.aid!==aid){ var ids=b.answers.map(function(a){return a.id}); var from=ids.indexOf(aid), to=ids.indexOf(tr.dataset.aid); if(from>-1&&to>-1){ var it=b.answers.splice(from,1)[0]; b.answers.splice(to,0,it); snapshot(); renderCanvas(); renderInspector(); } } }
  document.addEventListener('pointerup',up);
}

function wireInspector(b){
  var body=$('#inspbody');
  // collapsible
  $$('[data-sectgl]',body).forEach(function(hd){ hd.onclick=function(){ var k=hd.dataset.sectgl; var sec=hd.parentElement; var open=!sec.classList.contains('open'); sec.classList.toggle('open',open); openSecs[k]=open; }; });
  // segmented controls
  $$('[data-seg]',body).forEach(function(sg){ var name=sg.dataset.seg;
    $$('button',sg).forEach(function(btn){ btn.onclick=function(){ applySeg(b,name,btn.dataset.v); }; }); });
  // variant tiles
  $$('[data-variant]',body).forEach(function(t){ t.onclick=function(){ var parts=t.dataset.variant.split(':'); applyVariant(b,parts[0],parts[1]); }; });
  // text models (one history entry per edit)
  $$('[data-model]',body).forEach(function(inp){
    inp.addEventListener('input',function(){ b[inp.dataset.model]=inp.value; renderCanvas(); });
    inp.addEventListener('change',function(){ b[inp.dataset.model]=inp.value; snapshot(); });
  });
  // answers editing

function addMobile(b,pid){
  if(pid==='width') b.width_m=b.width||'full';
  else if(pid==='fontSize') b.style.fontSize_m=(b.style.fontSize!=null?b.style.fontSize:(b.type==='heading'?(b.style.size==='s'?18:b.style.size==='m'?23:b.style.size==='xl'?34:28):15));
  else if(pid==='acols'){ b.display=b.display||{mode:'list',columns:1}; b.display.columns_m=b.display.columns||1; }
  else if(pid==='columns') b.columns_m=b.columns||2;
  else if(pid==='cols') b.cols_m=b.cols||3;
  snapshot(); renderCanvas(); renderInspector();
}
function clearMobile(b,pid){
  if(pid==='width') delete b.width_m;
  else if(pid==='fontSize') delete b.style.fontSize_m;
  else if(pid==='acols'){ if(b.display) delete b.display.columns_m; }
  else if(pid==='columns') delete b.columns_m;
  else if(pid==='cols') delete b.cols_m;

}
function ans(b,id){ return b.answers.filter(function(x){return x.id===id})[0]; }

function applySeg(b,name,v){
  var n=parseInt(v,10); var num=!isNaN(n)&&String(n)===v;
  if(v==='on'||v==='off'){ b[name]=(v==='on'); snapshot(); renderCanvas(); renderInspector(); return; }
  switch(name){
    case 'sp_t': case 'sp_b': b.style[name]=v; break;
    case 'size': b.size=v; break;
    case 'aspect': b.aspect=v; break;
    case 'fit': b.fit=v; break;
    case 'width': b.width=v; break;
    case 'columns': b.columns=n; break;
    case 'acols': b.display.columns=n; break;
    case 'align': b.style.align=v; break;
    case 'hsize': b.style.size=v; break;
    case 'selection': b.selection=v; if(v==='multi'){b.maxSel=b.maxSel||3;b.minSel=b.minSel||1;} break;
    case 'minSel': b.minSel=n; break;
    case 'maxSel': b.maxSel=n; break;
    case 'consent': b.consent=(v==='yes'); break;
    case 'scaleMax': b.scaleMax=n; break;
    case 'variant': b.variant=v; break;
    case 'pstyle': b.pstyle=v; break;
    case 'dashSeg': b.dashed=(v==='dashed'); break;
    case 'ansSi': b.display=b.display||{mode:'list',columns:1}; b.display.si=v; break;
    case 'required': b.required=(v==='yes'); break;
    case 'width_m': b.width_m=v; break;
    case 'columns_m': b.columns_m=n; break;
    case 'acols_m': b.display=b.display||{mode:'list',columns:1}; b.display.columns_m=n; break;
    case 'cols': b.cols=n; break;
    case 'cols_m': b.cols_m=n; break;
    case 'tvariant': b.tvariant=v; break;
    case 'cvariant': b.cvariant=v; break;
    default: b[name]=num?n:v;
  }
  snapshot(); renderCanvas(); renderInspector();
}

function applyVariant(b,kind,val){
  if(kind==='answers'){
    b.display=b.display||{mode:'list',columns:2};
    b.display.mode=val;
    if(val==='cards'&&(!b.display.columns||b.display.columns<2)) b.display.columns=2;
    if(val==='tiles'&&(!b.display.columns||b.display.columns<2)) b.display.columns=2;
    if(val==='list') b.display.columns=b.display.columns||1;
    // preserve answers; if switching to image layout with no media, placeholders show automatically
  } else if(kind==='result'){ b.variant=val; }
  else if(kind==='image'){ b.imgvariant=val; if(val==='full'){b.size='full';} }
  snapshot(); renderCanvas(); renderInspector();
}

function placePop(pop, anchor, opts){

  var top=r.bottom+6, left=r.left;
  if(opts.above) top=r.top-pr.height-6;
  if(left+pr.width>window.innerWidth-8) left=window.innerWidth-pr.width-8;
  if(top+pr.height>window.innerHeight-8) top=r.top-pr.height-6;
  if(top<8) top=8;
  pop.style.top=Math.max(8,top)+'px'; pop.style.left=Math.max(8,left)+'px';
}

function blockAction(id,act){
  var arr=curBlocks(); var i=blockIndex(id); var changed=false;
  if(act==='dup'){ var c=clone(arr[i]); c.id=uid(); if(c.answers)c.answers.forEach(function(a){a.id=uid();}); arr.splice(i+1,0,c); doc.selected=c.id; changed=true; }
  else if(act==='up'&&i>0){ var t=arr[i];arr[i]=arr[i-1];arr[i-1]=t; changed=true; }
  else if(act==='down'&&i<arr.length-1){ var t2=arr[i];arr[i]=arr[i+1];arr[i+1]=t2; changed=true; }
  else if(act==='del'){ arr.splice(i,1); doc.selected=null; changed=true; }
  if(changed){ snapshot(); renderCanvas(); renderInspector(); }
}

function prodGradient(letter){ // a data-URI-free stand-in: use a canvas gradient
  var c=document.createElement('canvas'); c.width=120;c.height=120; var g=c.getContext('2d');
  var grd=g.createLinearGradient(0,0,120,120); grd.addColorStop(0,'#d8cfc2'); grd.addColorStop(1,'#efe6d8'); g.fillStyle=grd; g.fillRect(0,0,120,120);
  g.fillStyle='#a08d78'; g.font='700 54px Georgia'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(letter,60,64);
  return c.toDataURL();
}

      else if(t==='quadrant'){ s.bg.tl=cur.tl||'#0E7C6B'; s.bg.tr=cur.tr||'#F5A623'; s.bg.bl=cur.bl||'#6D5AE6'; s.bg.br=cur.br||'#211D17'; s.bg.x=cur.x!=null?cur.x:50; s.bg.y=cur.y!=null?cur.y:50; } }

  var CMAP={bg_c1:'c1',bg_c2:'c2',bg_a:'a',bg_b:'b',bg_tl:'tl',bg_tr:'tr',bg_bl:'bl',bg_br:'br'};

    inp.addEventListener('change',snapshot); });

  {id:'sub', name:'Subscription Onboarding', cat:'Subscription', icon:'i-cart', len:'25–40 questions', gate:'mid', gateLbl:'Gate mid-flow', result:'First box + profile', placement:'popup',
    introH:'Personalize your subscription', introSub:'Build your profile for your first box.', resultH:'Your first box', resultSub:'Curated from your profile.', cols:2,
    qs:[{q:'What are you most excited for?',a:['Discover new','Restock favorites','Gifts','Save money'],img:true},{q:'How often?',a:['Monthly','Every 2 months','Quarterly']},{q:'Your style?',a:['Classic','Trendy','Minimal','Bold']}]}
];
function genTemplate(t){
  var steps=[{id:'t-intro',kind:'intro',name:'Intro',blocks:[defWith('logo'),defWith('heading',{text:t.introH}),defWith('text',{text:t.introSub}),defWith('button',{label:'Start',width:'full'})]}];
  t.qs.forEach(function(q,i){
    steps.push({id:'t-q'+i,kind:'question',name:'Q'+(i+1),blocks:[defWith('progress'),defWith('heading',{text:q.q}),
      defWith('choice',{answers:q.a.map(function(l){return {id:uid(),label:l,media:null};}),display:{mode:q.img?'cards':'list',columns:q.img?(q.a.length>4?3:2):1}}),
      defWith('button',{label:'Next',width:'full'})]});
  });
  var gate={id:'t-email',kind:'email',name:'Email',blocks:[defWith('heading',{text:'Get your results'}),defWith('email',{discountUnlock:(t.gate==='result'||t.gate==='before')})]};
  var res={id:'t-res',kind:'result',name:'Result',blocks:[defWith('heading',{text:t.resultH}),defWith('text',{text:t.resultSub}),defWith('result',{variant:t.resultVariant||'grid',columns:t.cols||2,showWhy:true,showStars:true})]};
  if(t.gate==='deferred'){ steps.push(res); steps.push(gate); }
  else if(t.gate==='mid'){ steps.splice(Math.ceil(t.qs.length/2)+1,0,gate); steps.push(res); }
  else { steps.push(gate); steps.push(res); }
  return steps;
}
function applyTemplate(t){
  doc.steps=genTemplate(t); doc.currentStep=doc.steps[1]?doc.steps[1].id:doc.steps[0].id; doc.selected=null;
  doc.settings.placement=t.placement||'popup'; $('#qtitle').textContent=t.name;
  closeTemplates(); snapshot(); renderWorkspace();
}
function renderTemplates(){
  var b=$('#tplbody');
  b.innerHTML='<div class="tplgrid">'+QUIZ_TEMPLATES.map(function(t,i){
    return '<button class="tplcard" data-tpl="'+i+'"><div class="tc-top"><span class="tc-ic"><svg class="i"><use href="#'+(t.icon||'i-content')+'"/></svg></span><div><b>'+t.name+'</b><span class="tc-cat">'+t.cat+'</span></div></div>'+
      '<div class="tc-facts"><span>'+t.len+'</span><span>'+t.gateLbl+'</span><span>'+t.result+'</span></div>'+
      '<span class="tc-use">Use this template →</span></button>';
  }).join('')+'</div><div class="tplscratch">Prefer a blank canvas?<button id="tpl-scratch">Start from scratch</button></div>';
  $$('[data-tpl]',b).forEach(function(c){ c.onclick=function(){ applyTemplate(QUIZ_TEMPLATES[+c.dataset.tpl]); }; });
  $('#tpl-scratch',b).onclick=function(){
    var sid='s'+(Date.now()%100000);
    doc.steps=[{id:sid,kind:'question',name:'Q1',blocks:[defWith('progress'),defWith('heading',{text:'Your question here'}),defWith('choice'),defWith('button',{label:'Next',width:'full'})]}];
    doc.currentStep=sid; doc.selected=null; closeTemplates(); snapshot(); renderWorkspace();
  };
}
function openTemplates(){ renderTemplates(); $('#tplscrim').classList.add('on'); }
function closeTemplates(){ $('#tplscrim').classList.remove('on'); }
$('#tplbtn').onclick=openTemplates;
$('#tplx').onclick=closeTemplates;
$('#tplscrim').addEventListener('click',function(e){ if(e.target===$('#tplscrim')) closeTemplates(); });

// ---------- render all ----------
function renderAll(){ $('#stagestepname').textContent=curStep().name; renderCanvas(); renderInspector(); renderFilmstrip(); renderLibPanel(); $('#zlabel').textContent=doc.zoom+'%'; }

renderWorkspace(); updateUndo(); setTimeout(function(){ if(doc.tab==='build') fitDevice(); },60);
})();
</script>
