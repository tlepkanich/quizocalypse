<title>Questions step — full page (mock)</title>
<style>
  :root{
    --accent:#6D5AE6; --accent-2:#6B4FD8; --accent-ink:#3C3489; --accent-wash:#EDEBFC; --accent-tint:#F3F1FD;
    --ink:#2E2740; --ink-3:#5A5470; --ink-4:#7C7791; --ink-25:#B6B0C8;
    --rule:#E9E7EF; --rule-2:#F1EFF6; --cream-2:#F2F1F5; --ok:#158A5A; --ok-wash:#E4F3EB;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace; --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --brand:#0E7C6B; --b-bg:#FCFBF8; --b-card:#fff; --b-ink:#18201E; --b-dim:#6E7975; --b-line:#E7E9E6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#EDECF1;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;padding:22px 0 80px}
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px}
  .cap{font-size:12.5px;color:var(--ink-4);margin:0 2px 14px;line-height:1.6}.cap b{color:var(--ink-3)}
  .app{background:#fff;border:1px solid var(--rule);border-radius:18px;overflow:hidden;box-shadow:0 10px 34px rgba(120,110,150,.12)}

  .top{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid var(--rule-2)}
  .iconbtn{width:34px;height:34px;flex:none;border:1px solid var(--rule);background:#fff;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--ink-3)}.iconbtn:hover{background:var(--cream-2)}.iconbtn svg{width:17px;height:17px}
  .flow{flex:1;min-width:0;overflow-x:auto;padding:10px 2px;margin:-10px 0}   /* room for the current dot's ring; -margin keeps bar height */
  .track{display:flex;align-items:center;min-width:520px}
  .node{display:flex;align-items:center;gap:8px;position:relative;flex:none}
  .dot{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:600;background:var(--cream-2);color:var(--ink-4);position:relative}
  .node .lbl{font-size:12.5px;color:var(--ink-4);font-weight:500;white-space:nowrap}
  .node.cur .dot{background:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-wash);z-index:1;overflow:visible}
  .node.cur .lbl{color:var(--ink);font-weight:600}
  .node.done .dot{background:var(--accent-wash);color:var(--accent-ink)}
  .link{flex:1;height:2px;background:var(--rule);margin:0 10px;min-width:20px}.link.done{background:var(--accent-wash)}
  .node.cur.igniting .dot{animation:qzHalo 2.3s ease-in-out infinite}
  @keyframes qzHalo{0%,100%{box-shadow:0 0 0 3px var(--accent-wash),0 0 6px 1px rgba(109,90,230,.32)}50%{box-shadow:0 0 0 5px rgba(237,235,252,.55),0 0 18px 4px rgba(109,90,230,.58)}}
  .node.cur .dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .6s ease;background:conic-gradient(from 0deg,rgba(109,90,230,0) 48%,rgba(157,140,255,.95) 76%,#fff 85%,rgba(109,90,230,0) 94%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 0);mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 0)}
  .node.cur.igniting .dot::after{opacity:1;animation:qzSpin 1.9s linear infinite}@keyframes qzSpin{to{transform:rotate(360deg)}}
  .spark{position:absolute;font-size:9px;color:#fff;opacity:0;pointer-events:none;z-index:2;text-shadow:0 0 7px rgba(157,140,255,1)}
  .dot .spark.s1{top:-9px;right:-5px}.dot .spark.s2{bottom:-7px;left:-7px;font-size:7px}.dot .spark.s3{top:-2px;right:-10px;font-size:8px}
  .node.cur.igniting .spark{animation:qzTwinkle 1.7s ease-in-out infinite}@keyframes qzTwinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.1)}}
  .continue{flex:none;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;padding:9px 15px;border-radius:10px;cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;gap:6px}.continue:hover{background:var(--accent-2)}.continue svg{width:14px;height:14px}

  .content{padding:14px 16px 20px}
  .subhead{display:flex;align-items:center;gap:12px;margin-bottom:13px;flex-wrap:wrap}
  .qtabs{display:inline-flex;background:var(--cream-2);border-radius:10px;padding:3px}
  .qtabs button{border:none;background:transparent;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-4);padding:7px 15px;border-radius:8px;cursor:pointer}
  .qtabs button.on{background:#fff;color:var(--accent-ink);box-shadow:0 1px 2px rgba(109,90,230,.12)}
  .subhead .sp{flex:1}.hint{font-size:12px;color:var(--ink-4)}
  .newbtn{border:none;background:var(--accent);color:#fff;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;gap:5px}.newbtn:hover{background:var(--accent-2)}.newbtn svg{width:12px;height:12px}
  .panel{border:1px solid var(--rule);border-radius:14px;overflow:hidden}

  .qview{display:grid;grid-template-columns:var(--navw,304px) 9px minmax(340px,1fr);min-height:600px}
  .navcol{border-right:1px solid var(--rule-2);min-width:0;overflow:hidden}
  .resizer{cursor:col-resize;background:transparent;position:relative}
  .resizer::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:34px;border-radius:3px;background:var(--rule)}
  .resizer:hover::before,.resizer.drag::before{background:var(--accent)}
  .navhd{font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-25);padding:11px 13px 8px;border-bottom:1px solid var(--rule-2)}
  .navrow{cursor:pointer;border-bottom:1px solid var(--rule-2)}
  .navrow.drop-hi{box-shadow:inset 0 2px 0 var(--accent)}
  .navrow .cell{display:flex;gap:9px;align-items:flex-start;padding:10px 13px}
  .navrow:hover .cell{background:#FBFAFD}
  .navrow.on .cell{background:var(--accent-tint);box-shadow:inset 2.5px 0 0 var(--accent)}
  .ncn{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--ink-25);flex:none;min-width:15px;padding-top:1px}
  .ncn-edit{cursor:pointer;border-radius:4px;padding:0 2px;margin:0 -2px}.ncn-edit:hover{background:var(--accent-wash);color:var(--accent-ink)}
  .ncninput{width:24px;border:none;background:#fff;box-shadow:0 0 0 2px var(--accent-wash);border-radius:4px;text-align:center;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--accent-ink);outline:none;padding:1px 0;-moz-appearance:textfield}.ncninput::-webkit-outer-spin-button,.ncninput::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .navrow.dec .ncn{color:var(--accent)}
  .ncmid{min-width:0;flex:1}
  .ncq{font-size:12.5px;font-weight:600;line-height:1.32;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .nct{font-family:var(--mono);font-size:8.5px;font-weight:600;text-transform:uppercase;color:var(--ink-25);margin-top:3px}
  .ndrag{opacity:0;color:var(--ink-25);cursor:grab;flex:none;transition:opacity .12s;padding-top:1px}.ndrag svg{width:12px;height:12px}.navrow:hover .ndrag{opacity:1}
  .nmv{display:inline-flex;flex-direction:column;gap:2px;flex:none;opacity:.55;transition:opacity .12s}.navrow:hover .nmv,.navrow.on .nmv{opacity:1}
  .ndel{opacity:0;flex:none;border:none;background:transparent;color:var(--ink-25);cursor:pointer;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;transition:opacity .12s}.navrow:hover .ndel{opacity:1}.ndel:hover{background:#FBEEEC;color:#C1362B}.ndel svg{width:13px;height:13px}
  .nmvb{width:19px;height:14px;border:1px solid var(--rule);background:#fff;border-radius:4px;display:grid;place-items:center;cursor:pointer;color:var(--ink-4);padding:0}.nmvb:hover:not(:disabled){background:var(--accent-tint);border-color:var(--accent-wash);color:var(--accent-ink)}.nmvb:disabled{opacity:.3;cursor:default}.nmvb svg{width:9px;height:9px}
  .ncq.ed{cursor:text;border-radius:5px;margin:-1px -3px;padding:1px 3px}.ncq.ed:hover{background:rgba(109,90,230,.06)}.ncq.ed:focus{outline:none;background:#fff;box-shadow:0 0 0 2px var(--accent-wash);display:block;-webkit-line-clamp:unset;overflow:visible}
  .navadd{border:none;background:transparent;color:var(--accent-ink);font-size:12.5px;font-weight:500;padding:11px 14px;cursor:pointer;font-family:var(--sans);width:100%;text-align:left}.navadd:hover{background:var(--accent-tint)}
  .navterm{display:flex;align-items:center;gap:9px;padding:9px 13px;color:var(--ink-4);border-top:1px solid var(--rule-2);font-size:12px}
  .navterm .tc{width:18px;height:18px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--cream-2)}.navterm .tc svg{width:10px;height:10px}
  .navterm.skipped .tlabel{text-decoration:line-through;text-decoration-color:var(--ink-25);color:var(--ink-25)}.navterm .ts{margin-left:auto;font-family:var(--mono);font-size:8.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--accent-ink);background:var(--accent-wash);padding:2px 6px;border-radius:5px}

  .phonecol{background:#FBFAFC;padding:18px 16px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
  .pv-head{display:flex;align-items:center;gap:8px}
  .livechip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ok);background:var(--ok-wash);padding:4px 10px;border-radius:999px}
  .livedot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:blink 1.6s ease-in-out infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .edithint{font-size:11px;color:var(--ink-25)}
  .stage{flex:1;min-height:0;width:100%;display:grid;place-items:center}
  .pv-bar{display:flex;align-items:center;gap:10px;width:100%;padding:0 2px}
  .pv-bar .pv-sp{flex:1}
  .segbtns{display:inline-flex;background:var(--cream-2);border-radius:9px;padding:3px}
  .segbtns button{border:none;background:transparent;padding:6px 10px;border-radius:7px;cursor:pointer;color:var(--ink-4);display:grid;place-items:center}
  .segbtns button.on{background:#fff;color:var(--accent-ink);box-shadow:0 1px 2px rgba(109,90,230,.12)}
  .segbtns svg{width:15px;height:15px}
  .expandbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:#fff;color:var(--ink-3);font-size:12px;font-weight:600;padding:6px 11px;border-radius:9px;cursor:pointer;font-family:var(--sans)}.expandbtn:hover{background:var(--cream-2)}.expandbtn svg{width:13px;height:13px}
  .device{--vw:390px;--vh:800px;--s:.70;position:relative}
  .device.desktop{--vw:1180px;--vh:740px}
  .device.desktop .frame{border-radius:16px}.device.desktop .fade{border-radius:0 0 16px 16px}
  .device.desktop .scr{max-width:600px;margin:0 auto;padding-top:34px}
  .phscrim{position:fixed;inset:0;background:rgba(30,24,44,.66);display:none;align-items:center;justify-content:center;z-index:70;padding:24px}.phscrim.on{display:flex}
  .phclose{position:fixed;top:22px;right:24px;width:40px;height:40px;border:none;background:rgba(255,255,255,.14);color:#fff;border-radius:11px;cursor:pointer;display:grid;place-items:center}.phclose:hover{background:rgba(255,255,255,.24)}.phclose svg{width:18px;height:18px}
  .holder{width:calc(var(--vw)*var(--s));height:calc(var(--vh)*var(--s));position:relative}
  .frame{width:var(--vw);height:var(--vh);position:absolute;top:0;left:0;transform-origin:top left;transform:scale(var(--s));overflow:hidden;background:var(--b-bg);border-radius:44px;box-shadow:0 26px 62px -22px rgba(46,39,64,.30),0 0 0 1px var(--rule);display:flex;flex-direction:column}
  .screen{width:100%;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
  .dhead{display:none;flex:none;flex-direction:column}
  .dchrome{display:flex;align-items:center;gap:11px;padding:10px 15px;background:#F1F0F4;border-bottom:1px solid var(--b-line)}
  .dchrome .dots{display:flex;gap:6px;flex:none}.dchrome .dots i{width:9px;height:9px;border-radius:50%;background:#D3D0DC}
  .dchrome .durl{flex:1;min-width:0;background:#fff;border:1px solid #E4E2EC;border-radius:8px;padding:6px 13px;font-size:11.5px;color:#9a97a6;font-family:var(--mono);white-space:nowrap;overflow:hidden;filter:blur(1.7px);user-select:none}
  .dprog{height:6px;width:100%;background:rgba(0,0,0,.08)}.dprogfill{display:block;height:100%;background:var(--brand);width:0;transition:width .3s ease}
  .device.desktop .dhead{display:flex}
  .device.desktop .topbar{display:none}
  .fade{position:absolute;left:0;right:0;bottom:0;height:52px;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--b-bg));border-radius:0 0 44px 44px}
  /* floating type tag on the phone + popover */
  .typetag{position:absolute;top:16px;left:calc(100% + 14px);z-index:6;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;background:#fff;border:1px solid var(--rule);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink-3);cursor:pointer;box-shadow:0 3px 10px rgba(60,50,90,.13)}
  .typetag:hover{border-color:#D9D3F2}.typetag .tt-type{color:var(--accent-ink)}.typetag svg{width:10px;height:10px;color:var(--ink-25)}
  .typepop{position:absolute;top:52px;left:calc(100% + 12px);right:auto;z-index:7;width:min(212px,44vw);background:#fff;border:1px solid var(--rule);border-radius:13px;box-shadow:0 18px 44px -12px rgba(60,50,90,.30);padding:11px;display:none}
  /* desktop: the type editor can't float off the wide frame — dock it top-right inside the empty area beside the content */
  .device.desktop .typetag{top:6.5%;left:auto;right:18px}
  .device.desktop .typepop{top:calc(6.5% + 42px);left:auto;right:18px;width:220px}
  .typepop.open{display:block}
  .tp-h{font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-25);margin:2px 2px 7px}
  .tp-types{display:flex;flex-direction:column;gap:2px}
  .tp-type{display:flex;align-items:center;gap:9px;border:none;background:transparent;border-radius:8px;padding:8px 9px;font-size:13px;color:var(--ink);cursor:pointer;text-align:left;font-family:var(--sans);width:100%}
  .tp-type:hover{background:var(--cream-2)}
  .tp-type.on{background:var(--accent-tint);color:var(--accent-ink);font-weight:600}
  .tp-type .rd{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--ink-25);flex:none}
  .tp-type.on .rd{border-color:var(--accent);box-shadow:inset 0 0 0 3.5px var(--accent)}
  .tp-set{border-top:1px solid var(--rule-2);margin-top:8px;padding-top:10px;display:flex;flex-direction:column;gap:9px}
  .tp-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tp-lbl{font-size:11.5px;color:var(--ink-4);white-space:nowrap}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
  .stepper button{border:none;background:#fff;width:26px;height:28px;cursor:pointer;color:var(--ink-3);font-size:14px}.stepper button:hover{background:var(--cream-2)}
  .stepper .val{min-width:26px;text-align:center;font-size:12.5px;font-weight:600;font-family:var(--mono)}
  .lblinput{border:1px solid var(--rule);border-radius:8px;padding:6px 9px;font-size:12px;font-family:var(--sans);color:var(--ink)}.lblinput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-wash)}
  .typepop .lblinput{flex:1 1 66px;min-width:0}

  .scr{padding:20px 20px 44px;color:var(--b-ink);display:flex;flex-direction:column;min-height:100%}
  .topbar{display:flex;align-items:center;gap:10px;min-height:30px;margin-bottom:16px;flex:none}
  .back{display:none;align-items:center;gap:4px;border:1px solid var(--b-line);background:var(--b-card);color:var(--b-ink);font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px}.back.on{display:inline-flex}.back svg{width:13px;height:13px}
  .fbar{flex:1;height:5px;border-radius:999px;background:rgba(0,0,0,.08);overflow:hidden}.fbar span{display:block;height:100%;background:var(--brand)}
  .stepn{font-size:11px;color:var(--b-dim);font-weight:700}
  .edit{outline:1.5px dashed transparent;outline-offset:2px;border-radius:6px;cursor:text;transition:outline-color .12s,background .12s}
  .edit:hover{outline-color:rgba(14,124,107,.35);background:rgba(14,124,107,.05)}.edit:focus{outline:1.5px solid var(--brand);background:#fff}
  .q-scr{font-family:Georgia,serif;font-size:23px;line-height:1.22;font-weight:600;margin:0 0 8px}
  .subcap{font-size:12.5px;color:var(--b-dim);margin:0 0 16px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:9px;border:1px solid var(--b-line);background:var(--b-card);border-radius:13px;padding:12px 13px}
  .opt.hot{border:1.5px solid var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent)}
  .opt.drop-hi{box-shadow:inset 0 2px 0 var(--brand)}
  .opt .odrag{opacity:0;color:rgba(0,0,0,.28);cursor:grab;flex:none;transition:opacity .12s}.opt:hover .odrag{opacity:1}.opt .odrag svg{width:13px;height:13px}
  .opt .box{width:19px;height:19px;border-radius:6px;border:1.5px solid rgba(0,0,0,.28);flex:none}.opt.hot .box{border-color:var(--brand);background:var(--brand)}
  .opt .radio{width:19px;height:19px;border-radius:50%;border:1.5px solid rgba(0,0,0,.28);flex:none}.opt.hot .radio{border-color:var(--brand);box-shadow:inset 0 0 0 4px var(--brand)}
  .opt{cursor:pointer;position:relative}
  .opt .omore{opacity:0;border:none;background:transparent;color:rgba(0,0,0,.35);cursor:pointer;width:24px;height:24px;border-radius:6px;flex:none;transition:opacity .12s;display:grid;place-items:center}.opt:hover .omore{opacity:1}.opt .omore svg{width:15px;height:15px}.opt .omore:hover{background:rgba(0,0,0,.05)}
  .omenu{position:absolute;top:calc(100% - 2px);right:6px;z-index:8;background:#fff;border:1px solid var(--b-line);border-radius:10px;box-shadow:0 10px 26px -8px rgba(0,0,0,.28);padding:4px;display:none}.omenu.open{display:block}
  .omenu .omdel{display:flex;align-items:center;gap:7px;border:none;background:transparent;color:#C1362B;font-size:12.5px;font-weight:600;padding:8px 11px;border-radius:7px;cursor:pointer;font-family:var(--sans);white-space:nowrap}.omenu .omdel:hover{background:#FBEEEC}.omenu .omdel svg{width:13px;height:13px}
  .cbx{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);cursor:pointer}.cbx input{accent-color:var(--accent)}
  .story-img .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--brand);box-shadow:0 4px 14px rgba(0,0,0,.25)}.story-img .play svg{width:20px;height:20px;margin-left:2px}
  .sendrow{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}.sendin{border:1px solid var(--b-line);background:var(--b-card);border-radius:11px;padding:12px 13px;font-size:13px;color:#9aa3a0}
  .termsrow{display:flex;gap:8px;align-items:flex-start;font-size:11px;color:var(--b-dim);line-height:1.4;cursor:pointer;margin-top:2px}.termsrow .tbox{width:16px;height:16px;border:1.5px solid var(--b-line);border-radius:4px;flex:none;margin-top:1px}.termsrow u{color:var(--b-ink)}
  .discount-line{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--brand);margin:6px 0 2px}.discount-line svg{width:15px;height:15px}
  .tp-note{font-size:10.5px;line-height:1.45;color:var(--ink-25);padding:3px 2px 0;margin:0}
  .tp-cbxrow{padding:2px 2px}
  .msg-addimg{width:100%;border:1px dashed rgba(0,0,0,.2);background:rgba(0,0,0,.02);border-radius:14px;padding:18px;margin-bottom:14px;color:var(--b-dim);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:7px}.msg-addimg svg{width:16px;height:16px}
  .newsplit{display:inline-flex;border-radius:9px;overflow:hidden}
  .newsplit .nb-main{border-radius:0}.newsplit .nb-caret{border-radius:0;padding:8px 8px;border-left:1px solid rgba(255,255,255,.25)}.newsplit .nb-caret svg{width:12px;height:12px}

  .scalebar{position:relative;margin:8px 2px 2px}

<script>
  const $=id=>document.getElementById(id);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const ic=id=>`<svg><use href="#${id}"/></svg>`;
  const TYPES=["Single select","Multi select","Scale","Short text"];
  const POSTS=["How to choose your first snowboard","Waxing 101 — keep your base fast","Park vs. all-mountain — which rider are you?"];
  // recommendation buckets carried from Step 1 — each can carry content on its result page
  let BUCKETS=[
    {id:"b1",name:"Snowboards",img:1,content:{mode:"embed",post:0}},
    {id:"b2",name:"Automated Collection",img:2,content:{mode:"none"}},
    {id:"b3",name:"Hydrogen",img:3,content:{mode:"message",heading:"Why a Hydrogen board?",body:"Our lightest deck — built for all-day laps and quick edge-to-edge."}},
    {id:"b4",name:"Home page",img:4,content:{mode:"none"}},
  ];
  let QS=[
    {id:"q1",dec:true,type:"Single select",text:"What best describes how you ride? Choose the style that gets you most excited on the mountain.",answers:[{id:"a1",t:"Park & Freestyle — rails, jumps, and creative expression"},{id:"a2",t:"All-Mountain — I go wherever the mountain takes me"},{id:"a3",t:"Carving & Precision — edge-to-edge control on groomed runs"},{id:"a4",t:"Backcountry & Powder — off-piste and untracked terrain"}]},
    {id:"q2",type:"Multi select",set:{min:1,max:2},text:"Which features matter most? Pick the ones you care about.",answers:[{id:"b1",t:"Lightweight build"},{id:"b2",t:"Powder float"},{id:"b3",t:"Edge grip on ice"},{id:"b4",t:"Park durability"}]},
    {id:"c1",kind:"content",mode:"embed",src:"blog",post:0,action:"read",cap:{email:true,sms:false},img:1,excerpt:"A 2-minute read on size, flex, and shape so your first board feels right underfoot."},
    {id:"q3",type:"Scale",set:{min:1,max:5,low:"Beginner",high:"Expert"},text:"How would you honestly rate your riding ability right now?",answers:[]},
    {id:"q4",type:"Single select",text:"How important is board responsiveness and edge hold to you?",answers:[{id:"d1",t:"Critical — I want precision"},{id:"d2",t:"Nice to have"},{id:"d3",t:"Not a priority"}]},
    {id:"q5",type:"Single select",text:"What does your ideal riding day look like from a volume standpoint?",answers:[{id:"e1",t:"A few perfect runs"},{id:"e2",t:"Steady all-day laps"},{id:"e3",t:"Dawn-to-dusk everything"}]},
    {id:"q6",type:"Single select",text:"Which board characteristic matters most to you when choosing?",answers:[{id:"f1",t:"Stability at speed"},{id:"f2",t:"Playful & forgiving"},{id:"f3",t:"Float in powder"}]},
  ];
  let sel="q1", tab="Q", navw=304, phoneDev="mobile";
  const val=el=>el.isContentEditable?el.textContent:el.value;
  const cur=()=>QS.find(x=>x.id===sel)||QS[0];
  function ensureAnswers(q){if(q.type==="Single select"||q.type==="Multi select"){q.answers=q.answers||[];while(q.answers.length<2)q.answers.push({id:"a"+Date.now()+"_"+q.answers.length,t:"Answer "+(q.answers.length+1)});}}
  function stepper(key,v,min,max){return `<span class="stepper"><button data-step="${key}" data-dir="-1" data-min="${min}" data-max="${max}">−</button><span class="val">${v}</span><button data-step="${key}" data-dir="1" data-min="${min}" data-max="${max}">+</button></span>`;}

  function dnd(container, arr, done){
    if(!container)return; let from=null;
    [...container.querySelectorAll("[data-i]")].forEach(el=>{el.setAttribute("draggable","true");
      el.addEventListener("dragstart",e=>{from=+el.dataset.i;el.style.opacity=.45;e.stopPropagation();});
      el.addEventListener("dragend",()=>{el.style.opacity="";container.querySelectorAll(".drop-hi").forEach(x=>x.classList.remove("drop-hi"));});
      el.addEventListener("dragover",e=>{e.preventDefault();el.classList.add("drop-hi");});
      el.addEventListener("dragleave",()=>el.classList.remove("drop-hi"));
      el.addEventListener("drop",e=>{e.preventDefault();const to=+el.dataset.i;if(from===null||from===to)return;const m=arr.splice(from,1)[0];arr.splice(to,0,m);from=null;done();});});
  }

  function render(){
    $("hint").textContent = tab==="Q"?"Click any text on the phone to edit it":"Edit any cell inline";
    tab==="O"?renderOverview():renderQuestions();
  }

  function renderQuestions(){
    $("stage").innerHTML=`<div class="panel"><div class="qview" id="qview" style="--navw:${navw}px">
      <div class="navcol"><div class="navhd">Flow · ${QS.filter(x=>x.kind!=="content").length} questions${QS.some(x=>x.kind==="content")?` · ${QS.filter(x=>x.kind==="content").length} content`:""}</div><div id="navbody"></div>
        <button class="navadd" id="navAdd">+ Add question or content</button>
        <div class="navterm" id="emailTerm"><span class="tc">${ic("i-mail")}</span><span>Email capture</span></div>
        <div class="navterm"><span class="tc">${ic("i-target")}</span><span>Result reveal</span></div></div>
      <div class="resizer" id="resizer"></div>
      <div class="phonecol">
        <div class="pv-bar">
          <span class="segbtns"><button class="${phoneDev==="mobile"?"on":""}" data-dev="mobile" title="Mobile">${ic("i-mobile")}</button><button class="${phoneDev==="desktop"?"on":""}" data-dev="desktop" title="Desktop">${ic("i-desktop")}</button></span>
          <span class="pv-sp"></span>
          <button class="expandbtn" id="phExpand">${ic("i-expand")} Expand</button>
        </div>
        <div class="stage"><div class="device${phoneDev==="desktop"?" desktop":""}"><div class="holder">
          <div class="frame"><div class="dhead"><div class="dchrome"><span class="dots"><i></i><i></i><i></i></span><span class="durl">alpineboards.com/pages/find-your-board</span></div><span class="dprog"><span class="dprogfill"></span></span></div><div class="screen" id="screen"></div><span class="fade"></span></div>
          <button class="typetag" id="typetag"></button><div class="typepop" id="typepop"></div>
        </div></div></div>
      </div>
    </div></div>`;
    renderNav();renderPhone();renderTypePop();initResizer();fitPhone();syncEmailTerm();
    $("navAdd").onclick=()=>openNewModal();
    document.querySelectorAll(".phonecol .segbtns button").forEach(b=>b.onclick=()=>{phoneDev=b.dataset.dev;const dev=document.querySelector(".phonecol .device");dev.classList.toggle("desktop",phoneDev==="desktop");document.querySelectorAll(".phonecol .segbtns button").forEach(x=>x.classList.toggle("on",x===b));fitPhone();});
    $("phExpand").onclick=openPhoneExpand;
  }
  const emailSkipped=()=>QS.some(x=>x.kind==="content"&&x.mode==="embed"&&(x.action||"read")==="send"&&x.cap?.email!==false);
  function syncEmailTerm(){const el=$("emailTerm");if(!el)return;const sk=emailSkipped();el.className="navterm"+(sk?" skipped":"");el.innerHTML=`<span class="tc">${ic("i-mail")}</span><span class="tlabel">Email capture</span>${sk?`<span class="ts">Skipped · in content</span>`:""}`;}
  const cLabel=q=>q.mode==="embed"?(q.heading||(q.src==="blog"||!q.src?POSTS[q.post||0]:q.src==="video"?"Video":"Image")):(q.heading||"Message");
  const cMeta=q=>q.mode==="embed"?"◆ "+({blog:"Blog post",video:"Video",image:"Image"}[q.src||"blog"]):"◆ Message";
  function renderNav(){
    let n=0;
    $("navbody").innerHTML=QS.map((q,i)=>{
      const mvb=`<span class="nmv"><button class="nmvb" data-nmv="-1" data-id="${q.id}" ${i===0?"disabled":""} title="Move up">${ic("i-up")}</button><button class="nmvb" data-nmv="1" data-id="${q.id}" ${i===QS.length-1?"disabled":""} title="Move down">${ic("i-down")}</button></span>`;
      if(q.kind==="content"){const ed=q.mode==="message";
        return `<div class="navrow content${q.id===sel?" on":""}" data-i="${i}" data-sel="${q.id}"><div class="cell"><span class="ncn c">${ic("i-doc")}</span><span class="ncmid"><span class="ncq${ed?" ed":""}"${ed?` contenteditable data-navq="${q.id}"`:""}>${esc(cLabel(q))}</span><span class="nct">${cMeta(q)}</span></span><button class="ndel" data-navdel="${q.id}" title="Delete">${ic("i-trash")}</button>${mvb}</div></div>`;}
      return `<div class="navrow${q.id===sel?" on":""}${q.dec?" dec":""}" data-i="${i}" data-sel="${q.id}"><div class="cell"><span class="ncn ncn-edit" data-ord="${q.id}" title="Click to renumber — moves this question to that spot">${++n}</span><span class="ncmid"><span class="ncq ed" contenteditable data-navq="${q.id}">${esc(q.text)}</span><span class="nct">${esc(q.type)}</span></span><button class="ndel" data-navdel="${q.id}" title="Delete">${ic("i-trash")}</button>${mvb}</div></div>`;
    }).join("");
    $("navbody").querySelectorAll(".navrow").forEach(r=>r.addEventListener("click",e=>{if(e.target.closest(".nmv,.ncn-edit,.ndel,[data-navq]"))return;selectNav(r.dataset.sel);}));
    $("navbody").querySelectorAll("[data-navdel]").forEach(b=>b.onclick=e=>{e.stopPropagation();deleteItem(b.dataset.navdel);});
    $("navbody").querySelectorAll("[data-navq]").forEach(el=>{
      el.addEventListener("focus",()=>{if(sel!==el.dataset.navq)selectNav(el.dataset.navq);});
      el.addEventListener("input",()=>{const q=QS.find(x=>x.id===el.dataset.navq);if(q.kind==="content"){if(q.mode==="message")q.heading=val(el);}else q.text=val(el);const sc=$("screen");if(sc&&sel===el.dataset.navq){const h=q.kind==="content"?sc.querySelector("[data-ch]"):sc.querySelector("[data-pq]");if(h)h.textContent=el.textContent;}});
      el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();el.blur();}});
    });
    $("navbody").querySelectorAll(".ncn-edit").forEach(b=>b.onclick=e=>{e.stopPropagation();const qid=b.dataset.ord,cur=b.textContent.trim();b.innerHTML=`<input class="ncninput" type="number" min="1" value="${cur}">`;const inp=b.querySelector("input");inp.focus();inp.select();let done=false;const commit=ok=>{if(done)return;done=true;if(ok){const v=parseInt(inp.value,10);if(!isNaN(v))moveQuestionToOrdinal(qid,v);}renderNav();renderPhone();};inp.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();commit(true);}else if(ev.key==="Escape")commit(false);});inp.addEventListener("blur",()=>commit(true));});
    $("navbody").querySelectorAll("[data-nmv]").forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.id,d=+b.dataset.nmv,i=QS.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=QS.length)return;const t=QS[i];QS[i]=QS[j];QS[j]=t;renderNav();renderPhone();});
  }
  function selectNav(id){sel=id;$("navbody").querySelectorAll(".navrow").forEach(x=>x.classList.toggle("on",x.dataset.sel===sel));renderPhone();renderTypePop();}

  function renderPhone(){
    const q=cur(); const idx=QS.indexOf(q); const total=QS.length;
    if(!q){$("screen").innerHTML=`<div class="scr" style="display:grid;place-items:center;text-align:center;padding:40px"><div><div style="font-family:Georgia,serif;font-size:20px;color:var(--b-ink);margin-bottom:6px">No questions yet</div><div style="font-size:13px;color:var(--b-dim)">Use “Add” to create your first question or content block.</div></div></div>`;$("typetag").style.display="none";$("typepop").classList.remove("open");return;}
    $("typetag").style.display="";
    const _dp=document.querySelector(".phonecol .dprogfill");if(_dp)_dp.style.width=(((idx+1)/total)*100).toFixed(1)+"%";
    if(q.kind==="content"){renderStory(q,idx,total);return;}
    let body;
    if(q.type==="Scale"){
      if(!q.set||q.set.min==null)q.set={min:1,max:5,low:"",high:""};
      const s=q.set,count=s.max-s.min+1;
      if(q._sel==null||q._sel<s.min||q._sel>s.max)q._sel=s.min;
      const nums=Array.from({length:count},(_,k)=>{const v=s.min+k;return `<button class="sb-n${v===q._sel?" on":""}" data-si="${v}">${v}</button>`;}).join("");
      const fillW=count>1?((q._sel-s.min)/(count-1))*100:0;
      body=`<div class="scalebar"><div class="sb-track"><span class="sb-fill" style="width:${fillW}%"></span></div><div class="sb-nums">${nums}</div></div><div class="scale-labwrap"><div class="scale-lab"><span>${esc(s.low||s.min)}</span><span>${esc(s.high||s.max)}</span></div></div>`;
    } else if(q.type==="Short text"){ body=`<div class="txtmock">Type your answer…</div>`; }
    else {
      const multi=q.type==="Multi select";
      if(multi){if(!Array.isArray(q._selArr))q._selArr=[0];}else if(q._sel==null)q._sel=0;
      const isHot=k=>multi?q._selArr.includes(k):q._sel===k;
      body=`${multi?`<p class="subcap">Select up to ${q.set?.max||q.answers.length}</p>`:""}<div class="opts" id="popts">${q.answers.map((a,k)=>`<div class="opt${isHot(k)?" hot":""}" data-i="${k}"><span class="odrag">${ic("i-grip")}</span><span class="otext edit" contenteditable data-pa="${a.id}">${esc(a.t)}</span><button class="omore" data-more="${a.id}" aria-label="Answer options">${ic("i-dots")}</button><span class="omenu" data-omenu="${a.id}"><button class="omdel" data-adel="${a.id}">${ic("i-trash")} Delete answer</button></span></div>`).join("")}</div><button class="addopt" id="paddopt">+ Add answer</button>`;
    }
    $("screen").innerHTML=`<div class="scr"><div class="topbar"><button class="back ${idx>0?"on":""}">${ic("i-back")}Back</button><span class="fbar"><span style="width:${((idx+1)/total)*100}%"></span></span><span class="stepn">${idx+1}/${total}</span></div>

  function moveQuestionToOrdinal(id,targetOrd){

      const srcSel=`<select class="omi" data-ocf="src">${[["blog","Blog post"],["video","Video"],["image","Image"]].map(([v,l])=>`<option value="${v}"${src===v?" selected":""}>${l}</option>`).join("")}</select>`;
      const postRow=src==="blog"?`<div class="omrow"><span class="oml">Post</span><select class="omi" data-ocf="post">${POSTS.map((p,i)=>`<option value="${i}"${(q.post||0)===i?" selected":""}>${esc(p)}</option>`).join("")}</select></div>`:"";
      const actSel=`<select class="omi" data-ocf="action">${[["read","Read inside the quiz"],["send","Read more → send it to them"]].map(([v,l])=>`<option value="${v}"${(q.action||"read")===v?" selected":""}>${l}</option>`).join("")}</select>`;
      let send="";
      if((q.action||"read")==="send"){
        send=`<div class="omrow"><span class="oml">Collect</span><div class="ocbxs"><label><input type="checkbox" data-occ="email" ${q.cap?.email!==false?"checked":""}>Email</label><label><input type="checkbox" data-occ="sms" ${q.cap?.sms?"checked":""}>SMS</label></div></div>
        <div class="omrow"><span class="oml"></span><label class="ocbx1"><input type="checkbox" data-oct="terms" ${q.terms!==false?"checked":""}>Show terms &amp; consent</label></div>
        <div class="omrow"><span class="oml"></span><label class="ocbx1"><input type="checkbox" data-oct="discount" ${q.discount?"checked":""}>Offer a discount to unlock</label></div>
        <p class="omnote">Collecting here replaces the separate Email-capture step${q.discount?"; the coupon shows on the results page":""}.</p>`;
      }
      rest=`<div class="omrow"><span class="oml">Source</span>${srcSel}</div>${postRow}<div class="omrow"><span class="oml">Read more</span>${actSel}</div>${send}`;
    }
    return modeRow+rest;
  }
  function wireContentFields(root,q,rerender){
    root.querySelectorAll("[data-ocm]").forEach(b=>b.onclick=()=>{q.mode=b.dataset.ocm;if(q.mode==="embed"&&!q.src)q.src="blog";rerender();});
    root.querySelectorAll("[data-ocf]").forEach(el=>{const k=el.dataset.ocf,struct=(k==="src"||k==="action");el.addEventListener(el.tagName==="SELECT"?"change":"input",()=>{q[k]=k==="post"?+el.value:el.value;if(k==="action"&&q.action==="send"&&!q.cap)q.cap={email:true,sms:false};if(struct)rerender();});});
    root.querySelectorAll("[data-occ]").forEach(cb=>cb.onchange=()=>{if(!q.cap)q.cap={};q.cap[cb.dataset.occ]=cb.checked;});
    root.querySelectorAll("[data-oct]").forEach(cb=>cb.onchange=()=>{q[cb.dataset.oct]=cb.checked;rerender();});
  }
  function renderOvModal(){
    const q=QS.find(x=>x.id===ovEdit);if(!q)return;
    $("omBody").innerHTML=contentFieldsHTML(q)+`<button class="omadv" id="omAdv">${ic("i-gear")} Vary content by recommendation…</button>`;
    wireContentFields($("omBody"),q,renderOvModal);
    $("omAdv").onclick=()=>{closeOvModal();openBucketModal();};
  }
  $("omClose").onclick=closeOvModal;$("omDone").onclick=closeOvModal;
  $("ovscrim").addEventListener("click",e=>{if(e.target===$("ovscrim"))closeOvModal();});
  document.addEventListener("click",e=>{if(!e.target.closest(".ins")){const oc=$("ovcards");if(oc)oc.querySelectorAll(".ins.open").forEach(x=>x.classList.remove("open"));}});

  // ---- unified "add" modal: pick a type (incl. content), fill details, submit (blank ok) ----
  let __idc=0; const mkid=p=>p+"_"+(++__idc);
  let newDraft=null,newIndex=null;
  function openNewModal(atIndex){
    newDraft={type:"Single select",text:"",answers:[{id:mkid("a"),t:""},{id:mkid("a"),t:""}],set:{min:1,max:2},scaleMax:5,low:"",high:"",mode:"message",src:"blog",post:0,action:"read",cap:{email:true,sms:false},terms:true,discount:false,heading:"",body:""};
    newIndex=(typeof atIndex==="number")?atIndex:QS.length;
    renderNewModal();$("newscrim").classList.add("on");
  }
  function closeNewModal(){$("newscrim").classList.remove("on");newDraft=null;}
  function renderNewModal(){
    const d=newDraft;const TY=["Single select","Multi select","Scale","Short text","Content block"];
    let html=`<div class="omrow"><span class="oml">Type</span><select class="omi" id="ndType">${TY.map(t=>`<option${t===d.type?" selected":""}>${t}</option>`).join("")}</select></div>`;
    if(d.type==="Content block"){html+=contentFieldsHTML(d);}
    else{
      html+=`<div class="omrow top"><span class="oml">Question</span><textarea class="omi" id="ndText" rows="2" placeholder="Type your question (optional)">${esc(d.text)}</textarea></div>`;
      if(d.type==="Single select"||d.type==="Multi select"){
        html+=`<div class="omrow top"><span class="oml">Answers</span><div class="ndans">${d.answers.map((a,i)=>`<div class="ndarow"><span class="ndan">${i+1}</span><input class="omi" data-nda="${a.id}" value="${esc(a.t)}" placeholder="Answer ${i+1} (optional)"><button class="ndax" data-ndax="${a.id}" ${d.answers.length<=1?"disabled":""}>${ic("i-x")}</button></div>`).join("")}<button class="ndaadd" id="ndAdd">${ic("i-plus")} Add answer</button></div></div>`;
        if(d.type==="Multi select")html+=`<div class="omrow"><span class="oml">Select</span><div class="ndmm"><span class="ndml">Min</span>${stepper("ndmin",d.set.min,1,d.set.max)}<span class="ndml">Max</span>${stepper("ndmax",d.set.max,d.set.min,Math.max(1,d.answers.length))}</div></div>`;
      } else if(d.type==="Scale"){
        html+=`<div class="omrow"><span class="oml">Max</span><div class="ndmm">${stepper("ndsmax",d.scaleMax,2,10)}<span class="ndml" style="color:var(--ink-25)">Runs 1 → ${d.scaleMax}</span></div></div>
        <div class="omrow top"><span class="oml">End labels</span><div class="ndans"><input class="omi" id="ndLow" value="${esc(d.low)}" placeholder="Label for 1 (optional)"><input class="omi" id="ndHigh" value="${esc(d.high)}" placeholder="Label for ${d.scaleMax} (optional)"></div></div>`;
      }
    }
    $("ndBody").innerHTML=html;
    $("ndType").onchange=()=>{d.type=$("ndType").value;renderNewModal();};
    const t=$("ndText");if(t)t.oninput=()=>d.text=t.value;
    $("ndBody").querySelectorAll("[data-nda]").forEach(inp=>inp.oninput=()=>{const a=d.answers.find(x=>x.id===inp.dataset.nda);if(a)a.t=inp.value;});
    $("ndBody").querySelectorAll("[data-ndax]").forEach(b=>b.onclick=()=>{if(d.answers.length<=1)return;d.answers=d.answers.filter(a=>a.id!==b.dataset.ndax);if(d.set.max>d.answers.length)d.set.max=Math.max(1,d.answers.length);if(d.set.min>d.set.max)d.set.min=d.set.max;renderNewModal();});
    const add=$("ndAdd");if(add)add.onclick=()=>{d.answers.push({id:mkid("a"),t:""});renderNewModal();};
    const low=$("ndLow");if(low)low.oninput=()=>d.low=low.value;
    const high=$("ndHigh");if(high)high.oninput=()=>d.high=high.value;
    $("ndBody").querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{const k=b.dataset.step,dir=+b.dataset.dir,mn=+b.dataset.min,mx=+b.dataset.max;if(k==="ndmin")d.set.min=Math.max(mn,Math.min(mx,d.set.min+dir));else if(k==="ndmax"){d.set.max=Math.max(mn,Math.min(mx,d.set.max+dir));if(d.set.min>d.set.max)d.set.min=d.set.max;}else if(k==="ndsmax")d.scaleMax=Math.max(mn,Math.min(mx,d.scaleMax+dir));renderNewModal();});
    if(d.type==="Content block")wireContentFields($("ndBody"),d,renderNewModal);
  }
  function submitNew(){
    const d=newDraft;let item;
    if(d.type==="Content block"){item={id:mkid("c"),kind:"content",mode:d.mode,heading:d.heading,body:d.body,src:d.src,post:d.post,action:d.action,cap:d.cap,terms:d.terms,discount:d.discount,img:0};}
    else if(d.type==="Scale"){item={id:mkid("q"),type:"Scale",text:d.text,answers:[],set:{min:1,max:d.scaleMax,low:d.low,high:d.high}};}
    else if(d.type==="Short text"){item={id:mkid("q"),type:"Short text",text:d.text,answers:[]};}
    else{item={id:mkid("q"),type:d.type,text:d.text,answers:d.answers.map(a=>({id:mkid("a"),t:a.t}))};if(d.type==="Multi select")item.set={min:d.set.min,max:d.set.max};}
    QS.splice(newIndex,0,item);sel=item.id;closeNewModal();render();
  }
  $("ndClose").onclick=closeNewModal;$("ndAddBtn").onclick=submitNew;
  $("newscrim").addEventListener("click",e=>{if(e.target===$("newscrim"))closeNewModal();});
  $("newBtnQ").onclick=()=>openNewModal();
  document.querySelectorAll(".qtabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll(".qtabs button").forEach(x=>x.classList.toggle("on",x===b));render();});

  // ── Content by recommendation (advanced) ──
  function openBucketModal(){renderBucketModal();$("bscrim").classList.add("on");}
  function bucketRow(b,i){
    const modeOpts=[["none","No content"],["message","Message"],["embed","Embed a blog post"]].map(([v,l])=>`<option value="${v}"${b.content.mode===v?" selected":""}>${l}</option>`).join("");
    let cfg="";
    if(b.content.mode==="message")cfg=`<div class="brow-cfg"><input class="fi" data-bh="${i}" value="${esc(b.content.heading||"")}" placeholder="Heading (e.g. Why this board?)"><textarea class="fi" data-bb="${i}" rows="2" placeholder="A sentence or two of supporting copy" style="resize:vertical">${esc(b.content.body||"")}</textarea></div>`;
    else if(b.content.mode==="embed"){const posts=POSTS.map((p,k)=>`<option value="${k}"${(b.content.post||0)===k?" selected":""}>${esc(p)}</option>`).join("");cfg=`<div class="brow-cfg"><select class="fi" data-bp="${i}">${posts}</select></div>`;}
    return `<div class="brow"><div class="brow-top"><span class="brow-thumb sky${b.img}"></span><span class="brow-name">${esc(b.name)}</span><select class="brow-mode" data-bm="${i}">${modeOpts}</select></div>${cfg}</div>`;
  }
  function renderBucketModal(){
    $("bmodal").innerHTML=`<div class="m2-head"><h3>Content by recommendation</h3><button class="cl" id="bmc">✕</button></div>
      <div class="m2-body"><p class="m2-intro">Show a tailored content block on each recommendation's result page — a guide, story, or note that fits that outcome. Set one to “No content” to skip it.</p>
      ${BUCKETS.map((b,i)=>bucketRow(b,i)).join("")}</div>
      <div class="m2-foot"><button class="continue" id="bmdone">Done</button></div>`;
    $("bmc").onclick=$("bmdone").onclick=()=>$("bscrim").classList.remove("on");
    $("bmodal").querySelectorAll("[data-bm]").forEach(s=>s.onchange=()=>{const b=BUCKETS[+s.dataset.bm];b.content.mode=s.value;if(s.value==="embed"&&b.content.post==null)b.content.post=0;renderBucketModal();});
    $("bmodal").querySelectorAll("[data-bh]").forEach(i=>i.oninput=()=>{BUCKETS[+i.dataset.bh].content.heading=i.value;});
    $("bmodal").querySelectorAll("[data-bb]").forEach(i=>i.oninput=()=>{BUCKETS[+i.dataset.bb].content.body=i.value;});
    $("bmodal").querySelectorAll("[data-bp]").forEach(i=>i.onchange=()=>{BUCKETS[+i.dataset.bp].content.post=+i.value;});
  }
  $("bscrim").addEventListener("click",e=>{if(e.target===$("bscrim"))$("bscrim").classList.remove("on");});

  function ignite(){const n=$("curNode");n.classList.remove("igniting");void n.offsetWidth;n.classList.add("igniting");setTimeout(()=>n.classList.remove("igniting"),3000);}
  render();ignite();
</script>
