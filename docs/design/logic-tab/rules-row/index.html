<!doctype html><html><head><!-- frame-runtime --><!-- /frame-runtime --><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Logic Step Mock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Wiskr admin is a single light look (Quartz tokens, pulled from the live deploy). */
:root{
  --paper:#FFFFFF; --ground:#F5F4F8; --cell:#FAF9FC;
  --ink:#201C2E; --ink3:#4E4860; --ink4:#645E78; --ink25:#B4AFC4;
  --rule:#E4E1EC; --rule2:#EFEDF4; --line2:#CFCADC; --rule-strong:#948EA6;
  --accent:#5B45D6; --accent-ink:#4A36B8; --accent-wash:#EFECFD; --accent-line:#D5CDF8;
  --ok:#0F6B45; --ok-wash:#E7F3ED; --ok-line:#BFE0CF;
  --warn:#8A5300; --warn-wash:#FBF1E0; --warn-line:#EDD3A4; --warn-dot:#C98A1B;
  --crit:#A5241C; --crit-wash:#FBEDEC; --crit-line:#EFCBC7;
  --res:#1D4F91; --res-wash:#EAF2FE; --res-line:#C9DCFB;
  --scrim:rgba(32,28,46,.45);
  --r:6px; --r-sm:4px; --r-lg:8px;
  --lift:0 1px 2px rgba(32,28,46,.08),0 0 0 1px rgba(32,28,46,.04);
  --pop:0 12px 32px rgba(32,28,46,.16),0 0 0 1px rgba(32,28,46,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 14px/1.45 "Figtree",-apple-system,"Segoe UI","Helvetica Neue",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ── artifact shell (not part of the product) ── */
.shell{padding-block:14px 12px;padding-inline:16px;max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.shell h1{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.shell label{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink3)}
.stagewrap{overflow-x:auto;border-top:1px solid var(--rule);background:var(--paper)}
.stage{min-width:1200px;min-height:760px;background:var(--paper)}

/* ── funnel bar ── */
.fbar{display:flex;align-items:center;height:54px;border-bottom:1px solid var(--rule);padding:0 16px 0 0}
.fbar .logo{width:56px;height:54px;display:grid;place-items:center;border-right:1px solid var(--rule);margin-right:16px}
.fsteps{flex:1;display:flex;align-items:center}
.fstep{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);padding:6px 12px;border-radius:var(--r);white-space:nowrap}
.fstep.done{background:var(--accent-wash);color:var(--accent-ink);font-weight:500}
.fstep.now{color:var(--ink);font-weight:600}
.fstep .n{font-size:10.5px;font-weight:600;width:22px;height:22px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--rule2);color:var(--ink4)}
.fstep.now .n{background:var(--accent);color:#fff}
.fline{flex:1;height:2px;background:var(--rule2);min-width:24px}
.fbar .back{border:0;background:none;width:44px;height:54px;border-left:1px solid var(--rule);margin-left:16px;color:var(--ink3)}
.cta{border:0;background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:var(--r)}
.cta.blocked{background:var(--paper);color:var(--crit);box-shadow:inset 0 0 0 1px var(--crit)}
.work{max-width:1256px;margin:0 auto;padding:22px 16px 40px}

/* ── card: rail · pane · rules column ── */
.card{border:1px solid var(--rule);border-radius:var(--r-lg);background:var(--paper);overflow:hidden}
.grid3{display:grid;grid-template-columns:262px minmax(0,1fr) 304px}
.rail{border-right:1px solid var(--rule);background:var(--cell);padding:12px;min-height:480px;display:flex;flex-direction:column}
.railcount{margin-top:auto;padding:14px 8px 2px;font-size:12px;color:var(--ink4);display:flex;flex-wrap:wrap;gap:4px 12px}
.railcount .dot{margin:0 5px 1px 0}
.railhead{display:flex;align-items:center;gap:6px;padding:5px 8px 8px}
.kick{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink4);font-weight:600}
.railn{font-size:10px;color:var(--ink25);font-variant-numeric:tabular-nums}
.qi{display:flex;align-items:flex-start;gap:9px;width:100%;padding:9px 10px;border:0;background:none;border-radius:var(--r);text-align:left}
.qi:hover{background:var(--ground)}
.qi.on,.qi.on:hover{background:var(--paper);box-shadow:var(--lift)}
.qn{flex:0 0 14px;font-size:11px;line-height:1.6;color:var(--ink4);font-variant-numeric:tabular-nums}
.qtxt{flex:1;min-width:0;font-size:13.5px;line-height:1.4;color:var(--ink3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qi.on .qtxt{color:var(--ink);font-weight:600}
.qtag{flex:0 0 auto;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:var(--r-sm);background:var(--ground);color:var(--ink25);margin-top:2px}
.qtag.decides{background:var(--accent-wash);color:var(--accent-ink)}
.qtag.filter{background:var(--ok-wash);color:var(--ok)}
.qadd{width:100%;text-align:left;padding:11px 13px;margin-top:6px;border-radius:var(--r);font-size:13px;color:var(--ink4);border:1px dashed var(--line2);background:none}
.qadd:hover{border-color:var(--accent-line);color:var(--accent-ink)}

.pane{padding:18px 20px;min-width:0}
.paneh{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:16px}
.paneh h3{flex:1;min-width:0;margin:0;font-size:16px;font-weight:700;line-height:1.35}
.rolebtn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;background:transparent;border:1px solid transparent;border-radius:var(--r);padding:5px 9px;white-space:nowrap;flex:0 0 auto}
.rolebtn:hover{background:var(--ground);border-color:var(--rule)}
.cv{color:var(--ink25);font-size:9px}
.prule{height:1px;background:var(--rule);margin:0 0 8px}
.tray{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:6px 8px 6px 12px;border:1px solid var(--rule);background:var(--cell);border-radius:var(--r-lg)}
.tray .tray-lb{flex:none}
.tray-h{display:flex;align-items:center;gap:12px;min-height:24px}
.tray-lb{flex:1;font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink25)}
.tray-hint{font-size:12px;font-weight:600;color:var(--accent-ink)}
.tray-c{flex:1;min-width:0;display:flex;flex-wrap:nowrap;gap:6px;overflow:hidden}
.tchip{flex:none;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--rule);background:var(--paper);border-radius:var(--r);padding:3px 9px;font-size:12.5px;font-weight:600;color:var(--ink)}
.tchip:hover{border-color:var(--line2)}
.tchip.fresh{color:var(--ok);border-color:var(--ok-line)}
.tchip.fresh:not(.armed):hover{border-color:var(--ok)}
.tchip.armed{border-color:var(--accent);background:var(--accent-wash);color:var(--accent-ink)}
.tchip.tmore{border-style:dashed;color:var(--ink4)}
.tchip.tmore:hover{border-color:var(--accent);color:var(--accent-ink)}
.tcard{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:4px 11px 4px 4px}
.tcard:hover{border-color:var(--line2);box-shadow:var(--lift)}
.tcard.armed{border-color:var(--accent);background:var(--accent-wash);color:var(--accent-ink);font-weight:700}
.tcard.used{color:var(--ink25)}
.tcard.used .thumb{opacity:.55}
.thumb{width:30px;height:30px;flex:0 0 30px;border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px rgba(32,28,46,.05)}
.thumb.sm{width:22px;height:22px;flex-basis:22px}

.arow{display:grid;grid-template-columns:18px minmax(0,1fr) 200px 78px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule2)}
.arow:last-child{border-bottom:0}
.akey{font-size:11px;color:var(--ink25)}
.atext{font-size:14.5px;min-width:0}
.cell{display:flex;flex-wrap:wrap;align-items:center;gap:3px 2px;width:100%;min-height:30px;border:1px solid transparent;border-radius:var(--r);padding:2px 3px 2px 2px;cursor:pointer}
.cell:hover{background:var(--paper);border-color:var(--rule)}
.cell.blank{border-style:dashed;border-color:var(--line2)}
.cell.blank:hover{border-color:var(--accent)}
.cell.drop{border-style:dashed;border-color:var(--accent);background:var(--accent-wash)}
.cell.inert{cursor:default}
.cell.inert:hover{background:none;border-color:transparent}
.vbtn{display:flex;align-items:center;width:100%;font-size:13px;font-weight:500;color:var(--ink25);padding:4px 7px}
.cell:hover .vbtn{color:var(--accent-ink)}
.vbtn .cv{margin-left:auto}
.arow .cell{justify-content:center}
.arow .vbtn{justify-content:center;gap:6px}
.arow .vbtn .cv{margin-left:0}
.chipw{display:inline-flex;align-items:center;border-radius:var(--r-sm);padding-left:6px}
.chipw:hover{background:var(--ground)}
.chip{font-size:13px;font-weight:700}
.cn{font-size:11px;font-weight:600;color:var(--ink25);padding:0 5px;font-variant-numeric:tabular-nums}
.xone{width:16px;height:16px;border:0;background:none;color:var(--ink25);font-size:12px;line-height:1;border-radius:3px;opacity:0;padding:0}
.arow:hover .xone,.rrow:hover .xone,.xone:focus-visible{opacity:.85}
.xone:hover{color:var(--crit);opacity:1}
/* D11/B19: order is priority in both styles, so every rule row carries ↑/↓ beside its trash — shown on
   hover and on keyboard focus, holding their place the rest of the time so a row never reflows. */
.mv{display:inline-flex;gap:2px;flex:none}
.mv .xone{font-size:11px}
.mv .xone:hover{color:var(--accent-ink)}
.mv .xone:disabled{visibility:hidden;cursor:default}
.rr:focus-within .xone,.rrow:focus-within .xone{opacity:.85}
.rr:focus-within .grip{opacity:1}
.dash{color:var(--ink25);padding-left:7px}
.lchip{display:inline-flex;font-size:12px;font-weight:600;background:var(--warn-wash);color:var(--warn);border:1px solid var(--warn-line);border-radius:var(--r-sm);padding:1px 6px;margin-left:4px;cursor:pointer}
.go{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;color:var(--ink25);border:1px solid transparent;border-radius:var(--r);padding:3px 6px;background:none;white-space:nowrap}
.go:hover{border-color:var(--rule);color:var(--ink3)}
.go.set{color:var(--ink);font-weight:600}

.btn{border:1px solid var(--rule-strong);background:var(--paper);border-radius:var(--r);padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink3);white-space:nowrap}
.btn:hover{border-color:var(--ink3);color:var(--ink)}
.btn.pri{border-color:var(--accent);background:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--ground);border-color:var(--rule)}
.btn:disabled{border-color:var(--rule);background:var(--ground);color:var(--ink25);cursor:default}
.badge{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-size:10.5px;font-weight:700;background:var(--crit);color:#fff;margin-left:6px}

.rcol{position:relative;border-left:1px solid var(--rule);background:var(--cell);min-width:0}
.rcol-in{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;gap:10px}
.rcol-h{display:flex;align-items:center;gap:8px}
.rcol-h h4{margin:0;font-size:14.5px;font-weight:700;flex:1}
.rcol p{margin:0;font-size:12.5px;color:var(--ink4)}
.rlist{flex:0 1 auto;min-height:0;overflow-y:auto;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r)}
/* B62: the column is pinned to the grid row, so extra rules scroll inside the list. The count says how
   many there are and the fade says there is more below — macOS overlay scrollbars show neither. */
.rlistw{position:relative;flex:0 1 auto;min-height:0;display:flex;flex-direction:column}
.rlistw.more::after{content:"";position:absolute;left:1px;right:1px;bottom:1px;height:40px;border-radius:0 0 var(--r) var(--r);background:linear-gradient(rgba(255,255,255,0),var(--paper));pointer-events:none}
.rcount{margin-left:6px;font-size:12px;font-weight:600;color:var(--ink25);font-variant-numeric:tabular-nums}
.rempty{padding:10px 12px;font-size:12.5px;color:var(--ink3)}
.rrow{display:flex;gap:8px;align-items:flex-start;padding:9px 8px 9px 10px;border-bottom:1px solid var(--rule2);font-size:13px;line-height:1.7;cursor:pointer}
.rrow:last-child{border-bottom:0}
.rrow:hover{background:var(--cell)}
.rnum{flex:0 0 20px;height:20px;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink4);background:var(--ground);border-radius:var(--r-sm);margin-top:1px}
.rsay{flex:1;min-width:0;color:var(--ink4)}
/* B47: a chip never breaks across lines — a split chip draws half a border and reads as two conditions */
.cchip{background:var(--ground);border:1px solid var(--rule);border-radius:var(--r-sm);padding:1px 5px;font-weight:600;color:var(--ink);white-space:nowrap}
.cchip i{font-style:normal;color:var(--ink4);font-weight:500;margin-right:4px}
.cchip.v{background:var(--accent-wash);border-color:var(--accent-line);color:var(--accent-ink)}
.cchip.res{background:var(--res-wash);border-color:var(--res-line);color:var(--res)}
.rcol-f{margin-top:auto;display:flex;gap:4px}
.link{border:0;background:none;padding:3px 6px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;color:var(--accent-ink)}
.link:hover{background:var(--accent-wash)}
.status{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;border-bottom:1px solid var(--rule);padding:8px 12px 8px 20px}
.stitle{display:inline-flex;align-items:baseline;gap:8px;border:0;background:none;padding:2px 8px;margin-left:-8px;border-radius:var(--r);font-size:20px;font-weight:700;letter-spacing:-.015em;line-height:1.25;color:var(--ink)}
.stitle:hover{background:var(--ground)}
.stitle .cv{font-size:11px;color:var(--ink4)}
.sdesc{flex:1;min-width:280px;display:flex;flex-direction:column;gap:2px}
.status b{color:var(--ink);font-weight:700;font-size:20px;letter-spacing:-.015em;line-height:1.25}
.status-l{display:flex;flex-direction:column;gap:5px;min-width:0}
.status-l>div{display:flex;align-items:baseline;gap:12px}
.status .link{font-size:13px;padding:2px 6px}
.status-p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink4)}
.status .more{display:inline-flex;align-items:center;gap:3px;margin-left:8px;border:0;background:none;padding:1px 5px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;color:var(--accent-ink)}
.status .more:hover{background:var(--accent-wash)}
.status .more span{font-size:9px}
.status .more.open span{transform:rotate(180deg)}
.status .sp{flex:1}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin:0 5px 1px 10px}
.dot.d{background:var(--accent)}.dot.f{background:var(--ok)}.dot.i{background:var(--ink25)}

/* ── popovers ── */
/* B27: a popover capped to the room beside its anchor scrolls inside itself, so the ones with no
   .vplist of their own (Fix issues, the role / route / type menus) never run off the screen. */
#pop{position:absolute;z-index:50;background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--pop);padding:10px;font-size:13px;overflow-y:auto}
/* B60: a popover has a fixed width, so a 60-character answer in its title breaks rather than paints outside */
.pt{font-size:12px;font-weight:700;padding:4px 8px 8px;overflow-wrap:anywhere}
.mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:var(--r);padding:7px 8px;text-align:left;font-size:13.5px}
.mi:hover{background:var(--ground)}
.mi.on{background:var(--accent-wash);color:var(--accent-ink)}
.mi .h{margin-left:auto;font-size:11.5px;color:var(--ink4);text-align:right}
.mi.tl{font-weight:600}
.mi.tl.fresh:not(.on){color:var(--ok)}
.ck{width:15px;height:15px;border:1px solid var(--line2);border-radius:3px;display:grid;place-items:center;font-size:10px;color:#fff;flex:0 0 15px;background:var(--paper)}
.on>.ck{background:var(--accent);border-color:var(--accent)}
.pfoot{border-top:1px solid var(--rule2);margin-top:8px;padding:9px 8px 2px;font-size:12px;color:var(--ink4);text-align:center}
.vptools{display:flex;flex-direction:column;gap:8px;padding:0 8px 8px;border-bottom:1px solid var(--rule2)}
.vpsearch{width:100%;border:1px solid var(--rule-strong);border-radius:var(--r);padding:6px 9px;font:inherit;font-size:13px;color:var(--ink);background:var(--paper)}
.vptabs{display:flex;flex-wrap:wrap;gap:4px}
.vptabs button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--ink3)}
.vptabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.vptabs .c{font-size:10.5px;color:var(--ink25);margin-left:4px}
.vptabs button[aria-pressed="true"] .c{color:#C9C4D6}
.vplist{max-height:300px;overflow-y:auto;padding:2px 0 4px}
.vpg{display:flex;align-items:center;gap:8px;padding:10px 8px 3px;font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--ink4)}
.vpg span{flex:1}
.vpall{border:0;background:none;padding:1px 4px;border-radius:var(--r-sm);font-size:11.5px;font-weight:600;color:var(--accent-ink);text-transform:none;letter-spacing:0}
.vpall:hover{background:var(--accent-wash)}
.vpnone{padding:14px 8px;text-align:center;font-size:12.5px;color:var(--ink4)}
.vpfoot{display:flex;align-items:center;gap:6px;border-top:1px solid var(--rule2);margin-top:2px;padding:9px 2px 1px 8px;font-size:12.5px;color:var(--ink4)}
.vpfoot span{flex:1}
.vpfoot b{color:var(--ink)}
.chip.all{font-weight:600;color:var(--ink4)}
.mi.mi2{flex-direction:column;align-items:flex-start;gap:1px;padding:7px 10px}
.mi2 .t{font-size:13.5px}
.mi2 .d{font-size:11.5px;color:var(--ink4)}
.mi2.on .d{color:var(--accent-ink)}
.mi.pk{color:var(--ink);font-weight:600}
.mi.pk.fresh{color:var(--ok);font-weight:600}
.mi.pk.on{color:var(--ink);font-weight:600}
/* ── Table view: the whole logic as a sheet ── */
.vseg2{display:inline-flex;background:var(--rule2);border-radius:var(--r);padding:2px}
.vseg2 button{border:0;background:none;padding:4px 11px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;color:var(--ink4)}
.vseg2 button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--lift)}
.tview{padding:14px 20px 20px;display:flex;flex-direction:column;gap:18px}
.tsheet-h{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.tsheet-h h3{margin:0;font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--ink4)}
.tsheet-h span{font-size:11.5px;color:var(--ink25)}
.twrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r)}
.xl{width:100%;border-collapse:collapse;font-size:13px;line-height:1.4}
.xl th{background:var(--ground);text-align:left;font-size:11.5px;font-weight:700;color:var(--ink3);padding:7px 10px;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule2);white-space:nowrap}
.xl td{padding:7px 10px;border-top:1px solid var(--rule2);border-right:1px solid var(--rule2);vertical-align:top;color:var(--ink)}
.xl th:last-child,.xl td:last-child{border-right:0}
.xl tbody tr:first-child td{border-top:0}
.xl tr.grp td{border-top:1px solid var(--rule)}
.xl tr.tgo{cursor:pointer}
.xl tr.tgo:hover td{background:var(--cell)}
.xl tr.muted td{color:var(--ink4);background:var(--cell)}
.xl td.k{width:40px;color:var(--ink4);font-weight:600;font-variant-numeric:tabular-nums}
.xl td.qt{width:26%;color:var(--ink3)}
.xl td.num{font-variant-numeric:tabular-nums}
.xl td.dim{color:var(--ink4);white-space:nowrap}
.xl td.res{color:var(--res);font-weight:600}
.xl td.verb{color:var(--accent-ink);font-weight:600;white-space:nowrap}
.xl td.does{white-space:nowrap;font-weight:600;font-size:12.5px}
.xl td.does.decides{color:var(--accent-ink)}
.xl td.does.filter{color:var(--ok)}
.xl td.does.info{color:var(--ink4);font-weight:500}
.xl td.unset{color:var(--warn);font-weight:600}
/* D14 (R3): "Has a rule" is the settled state, not a green success */
.xl td.ok{color:var(--ink);font-weight:600}
.tnote{margin:0;font-size:12px;color:var(--ink4)}
.cj{font-weight:800;color:var(--ink)}
.qlab{font-style:normal;font-weight:600;color:var(--ink4);margin-right:3px}
.ed{display:block;border-radius:3px;outline:none;cursor:text;padding:1px 4px;margin:-1px -4px}
.ed:hover{background:var(--ground)}
.ed:focus{background:var(--paper);box-shadow:0 0 0 2px var(--accent-line)}
.paneh h3 .ed,.atext .ed{display:inline}
/* a numbered scale point is an empty editable: it shows its end label, or "Add label", until it is named */
.ed[data-pt]{display:inline-block}
.ed[data-pt]:empty{min-width:7em}
.ed[data-pt]:empty::before{content:attr(data-ph);color:var(--ink4)}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:none;border-radius:var(--r-sm);padding:2px 6px;margin:-3px -7px;font:inherit;color:inherit;text-align:left}
.tbtn:hover{border-color:var(--rule);background:var(--paper)}
.tbtn .cv{font-size:9px;color:var(--ink25)}
.xl .tbtn.does{font-weight:600;font-size:12.5px;white-space:nowrap}
.xl .tbtn.does.decides{color:var(--accent-ink)}
.xl .tbtn.does.filter{color:var(--ok)}
.xl .tbtn.does.info{color:var(--ink4);font-weight:500}
.xl .tbtn.res{color:var(--res);font-weight:600}
.xl .tbtn.unset{color:var(--warn);font-weight:600}
.xl .tbtn.dim{color:var(--ink4);white-space:nowrap}
.xl .dim2{color:var(--ink25)}
.xl tr.tgo{cursor:pointer}
.xl tr.tgo:hover td{background:var(--cell)}
.iox{display:inline-flex;border:1px solid var(--rule-strong);border-radius:var(--r);overflow:hidden}
.iox button{border:0;background:var(--paper);padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink3)}
.iox button+button{border-left:1px solid var(--rule)}
.iox button:hover{background:var(--ground);color:var(--ink)}
/* B37: while a save is pending Export stays off, and looks off */
.iox button:disabled{background:var(--paper);color:var(--ink25);cursor:default}

.find{display:flex;gap:9px;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:var(--r);font-size:13px;color:var(--ink3)}
button.find:hover{background:var(--ground)}
.sv{flex:0 0 8px;width:8px;height:8px;border-radius:50%;margin-top:6px}
.sv.crit{background:var(--crit)}.sv.warn{background:var(--warn-dot)}.sv.note{background:var(--ink25)}.sv.ok{background:var(--ok)}

/* ══ Create a rule — the window ══
   Width hugs the widest answer row (capped at six buckets); a row with more
   scrolls sideways inside itself. Questions scroll; THEN, the recommendations
   and the footer stay put. */
#modal{position:fixed;inset:0;z-index:40;background:var(--scrim);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
/* an open window locks the page behind it: the wheel over the scrim can't scroll the page (or carry a popover away) */
html:has(#modal:not([hidden]),#aqm:not([hidden]),#addrec:not([hidden])){overflow:hidden}
.mbox{display:flex;flex-direction:column;width:fit-content;min-width:min(680px,100%);max-width:100%;max-height:100%;background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--pop);overflow:hidden}
.mhead{flex:none;display:flex;align-items:center;padding:5px 8px 5px 22px;border-bottom:1px solid var(--rule2)}
.mhead h2{margin:0;flex:1;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink4)}
.mx{width:24px;height:24px;border:1px solid transparent;background:none;border-radius:var(--r-sm);color:var(--ink25);font-size:14px;line-height:1}
.mx:hover{background:var(--ground);border-color:var(--rule)}
.mscroll{flex:1 1 auto;min-height:0;overflow-y:auto}
.mq{padding:0 22px}
.mrow{display:grid;grid-template-columns:22px 184px 44px minmax(0,auto);gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule2)}
.mrow:last-child{border-bottom:0}
.mqn{font-size:11.5px;font-weight:700;color:var(--ink25);font-variant-numeric:tabular-nums}
.mtag{display:inline-block;vertical-align:2px;margin-left:6px;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-wash);border-radius:var(--r-sm);padding:1px 5px}
.mqt{font-size:13.5px;font-weight:400;line-height:1.3;color:var(--ink)}
.mrow.live .mqn{color:var(--accent-ink)}
.mop{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.opb{border:1px solid var(--rule);background:var(--paper);border-radius:var(--r-sm);padding:3px 4px;font-size:12px;font-weight:600;color:var(--ink3);text-align:center;white-space:nowrap}
.opb:hover{border-color:var(--line2);color:var(--ink)}
.opb.not{background:var(--warn-wash);border-color:var(--warn-line);color:var(--warn)}
.opb.sub{padding:2px 2px;font-size:10.5px;font-weight:500;border-style:dashed}
.opb.sub[disabled]{cursor:default;color:var(--ink25);border-color:var(--rule2)}
/* D12 (R5): on an "is not" row the any/all toggle is HIDDEN, not dimmed — nothing to read, nothing to
   focus, nothing announced. It keeps its slot so the row never reflows when the verb is switched. */
.opb.sub.gone{visibility:hidden}
.manswrap{position:relative;min-width:0}
.mans{display:flex;gap:8px;max-width:676px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.manswrap.more::after{content:"";position:absolute;top:0;right:0;bottom:6px;width:44px;background:linear-gradient(90deg,rgba(255,255,255,0),var(--paper));pointer-events:none}
.bk{flex:0 0 104px;height:68px;border:1px solid var(--rule);background:var(--paper);border-radius:var(--r);padding:0 9px;text-align:left;font-size:12.5px;line-height:1.3;color:var(--ink3)}
.bk span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bk:hover{border-color:var(--line2);color:var(--ink)}
.bk.on{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.mrow.isnot .bk.on{background:var(--warn-wash);border-color:var(--warn-dot);color:var(--warn)}
.mthen{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:18px 12px 0 22px}
.msp{flex:1}
.mqlab{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink4);padding:16px 0 0}
.mlab{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink4)}
.vseg{display:inline-flex;background:var(--ground);border:1px solid var(--rule);border-radius:var(--r);padding:2px}
.vseg button{border:0;background:none;padding:3px 10px;border-radius:var(--r-sm);font-size:12px;font-weight:400;color:var(--ink4)}
/* B48: the chosen verb says so with aria-pressed, and the style reads the same attribute */
.vseg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--lift)}
.vhint{font-size:12.5px;color:var(--ink4)}
.mband{padding:12px 22px 16px;border-bottom:1px solid var(--rule);contain:inline-size}
.mband-in{border:1px solid var(--rule);background:var(--cell);border-radius:var(--r-lg);padding:9px 12px 11px}
.mband-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:24px}
.mband-h .tray-lb{flex:0 0 auto}
.frac{font-size:11px;font-weight:600;color:var(--ink4);font-variant-numeric:tabular-nums}
.frac b{color:var(--warn)}
/* D14 (R3): all of them settled reads black, not green — green here is "not placed" */
.frac.all b{color:var(--ink)}
.mband-h .sp{flex:1}
.addelse{border:1px dashed var(--line2);background:none;border-radius:var(--r);padding:3px 9px;font-size:12px;font-weight:600;color:var(--ink4)}
.addelse:hover{border-color:var(--accent-line);color:var(--accent-ink)}
.mrecs{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.rc.more{border-style:dashed;color:var(--ink4)}
.rc.more:hover{border-color:var(--accent);color:var(--accent-ink)}
.rc{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:6px 10px 6px 8px}
.rc:hover{border-color:var(--line2);box-shadow:var(--lift)}
.rc.on{border-color:var(--accent);background:var(--accent-wash);color:var(--accent-ink)}
.rc .n{font-size:11px;font-weight:600;color:var(--ink25);font-variant-numeric:tabular-nums}
.rc .st{width:7px;height:7px;border-radius:50%;background:var(--warn-dot)}
/* D14 (R3): green is reserved for "not placed on any answer" — the tray, the picker and the tray's
   "+N more" all mean that by it, and two opposite greens were on screen at once (the tray behind this
   window painted `dryness` green for NOT placed while this dot painted it green for covered). Done
   takes D14's own word for settled instead: black. Amber still means "this one needs a rule". */
.rc .st.done{background:var(--ink)}
.mfoot{flex:none;display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 8px;padding:13px 14px 13px 22px;background:var(--ground);border-top:1px solid var(--rule)}
/* the live sentence stops at three lines and scrolls, so a long rule never eats the questions */
.msay{flex:1 1 260px;min-width:0;contain:inline-size;font-size:13px;color:var(--ink4);line-height:1.8;padding-top:3px;max-height:calc(3 * 1.8em + 3px);overflow-y:auto;overscroll-behavior:contain}
.mfoot .btn{padding:8px 14px;font-size:13.5px}
@media (max-width:720px){
  .mrow{grid-template-columns:24px minmax(0,1fr) auto;gap:8px 10px}
  .manswrap{grid-column:1/-1}
  .mop{flex-direction:row}
}
/* only the toast's Undo takes clicks; placeToast lifts it above an open window's footer */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:9px 14px;border-radius:var(--r);z-index:60;max-width:calc(100% - 32px);pointer-events:none}

/* ══ Rules only: the rules row, and what sits under it ══ */
.shell .seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--rule2);border-radius:var(--r-lg);padding:3px}
.shell .seg button{border:0;background:none;padding:6px 11px;border-radius:var(--r);font-size:13px;font-weight:600;color:var(--ink4)}
.shell .seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--lift)}
.shell .sp{flex:1}
.pitch{max-width:1240px;margin:0 auto;padding:0 16px 12px;font-size:13.5px;line-height:1.5;color:var(--ink3)}
.rband{padding:16px 20px;border-bottom:1px solid var(--rule)}
.sact{display:flex;align-items:center;gap:10px;align-self:center;margin-left:auto}
.sact .btn.pri{padding:6px 13px;font-size:13px}
.rband-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rband-h h3{margin:0;font-size:15px;font-weight:700}
.rband-h .cnt{font-size:12px;font-weight:600;color:var(--ink25);font-variant-numeric:tabular-nums}
.rband-h .sub{flex:1;min-width:0;font-size:12.5px;color:var(--ink4);padding-left:4px}
.rband-h .btn.pri{padding:7px 14px;font-size:13px}
/* B48: the rules are an ordered list — order is priority — and the row is not a fake button with real
   buttons inside it. The label is its own button (.rbody); the trash and ↑/↓ are its siblings. The
   flex gaps move onto .rbody unchanged, so the row draws exactly as it did. */
.rlist2{border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;list-style:none;margin:0;padding:0}
.rr .rbody,.rrow .rbody{display:flex;flex:1;min-width:0;border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.rr .rbody{align-items:center;gap:10px}
.rrow .rbody{align-items:flex-start;gap:8px}
.tgob{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;vertical-align:baseline}
.rr{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 6px;border-bottom:1px solid var(--rule2);cursor:pointer;background:var(--paper)}
.rr:hover{background:var(--cell)}
.rr:last-child{border-bottom:0}
.rr .grip{width:12px;flex:none;font-size:12px;color:var(--ink25);opacity:0;cursor:grab;text-align:center}
.rr:hover .grip{opacity:1}
.rr .rn{flex:none;min-width:22px;height:22px;border-radius:var(--r-sm);background:var(--ground);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--ink4);font-variant-numeric:tabular-nums}
.rr .rs{flex:1;min-width:0;font-size:13px;line-height:1.75;color:var(--ink4)}
.rr.dead .rsent,.rrow.dead .rsent{opacity:.6}
.rtag{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--crit);background:var(--crit-wash);border-radius:var(--r-sm);padding:1px 6px}
.rr:hover .xone,.rr .xone:focus-visible{opacity:.85}
.rr.dragging{opacity:.4}
/* B18: the line is drawn on the edge the rule will land on — above the row, or below it when the drag
   is heading down, so where the line is is where the rule goes. */
.rr.over{box-shadow:inset 0 2px 0 var(--accent)}
.rr.under{box-shadow:inset 0 -2px 0 var(--accent)}
.relse{padding:9px 12px 9px 50px;font-size:12.5px;color:var(--ink4);background:var(--cell)}
.relse b{color:var(--ink3);font-weight:600}
.rempty2{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 16px;border:1px dashed var(--line2);border-radius:var(--r-lg);text-align:center;font-size:13.5px;color:var(--ink4)}
.rempty2 b{color:var(--ink)}
.rempty2 .btn.pri{padding:7px 14px;font-size:13px}
.viz{padding:12px 20px 16px;background:var(--cell)}
.viz-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:8px}
.viz-h h3{margin:0;font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--ink4)}
.viz-h .sub{font-size:12px;color:var(--ink4)}
.viz-h .sub b{color:var(--ink);font-variant-numeric:tabular-nums}
.viz-h .sp{flex:1}
.sd{width:7px;height:7px;flex:none;border-radius:50%;background:var(--warn-dot)}
/* D14 (R3): same system as .rc .st — amber needs a rule, black has one, and green stays the tray's */
.sd.on{background:var(--ink)}
.rref{border:1px solid var(--rule);background:var(--paper);border-radius:var(--r-sm);padding:1px 7px;font-size:12px;font-weight:600;color:var(--ink3)}
.rref:hover{border-color:var(--accent);color:var(--accent-ink)}
/* 1 · recommendations */
.recrow{display:flex;flex-wrap:nowrap;gap:6px;overflow:hidden}
.recrow>*{flex:none}
.rpill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--paper);border-radius:var(--r);padding:6px 12px 6px 11px;font-size:13.5px;font-weight:600;color:var(--ink)}
.rpill .sd{width:8px;height:8px}
.rpill.none{border-style:dashed;border-color:var(--warn-line)}
.rpill.none .add{font-weight:600;color:var(--accent-ink)}
.rpill.none:hover{border-color:var(--accent)}
.rpill.add{border-style:dashed;border-color:var(--line2);background:none;color:var(--ink4)}
.rpill.add:hover{border-color:var(--accent);color:var(--accent-ink)}
.rr.lit{background:var(--accent-wash)}
/* Add recommendations — the window */
#addrec{position:fixed;inset:0;z-index:45;background:var(--scrim);display:grid;place-items:center;padding:16px}
.arbox{width:min(580px,100%);max-height:min(640px,100%);display:flex;flex-direction:column;background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--pop);overflow:hidden}
.arhead{display:flex;align-items:center;padding:12px 12px 12px 20px;border-bottom:1px solid var(--rule)}
.arhead h2{margin:0;flex:1;font-size:16px;font-weight:700}
.artools{display:flex;flex-direction:column;gap:10px;padding:12px 20px 10px;border-bottom:1px solid var(--rule2)}
.arsearch{width:100%;border:1px solid var(--rule-strong);border-radius:var(--r);padding:8px 10px;font:inherit;font-size:13.5px;color:var(--ink);background:var(--paper)}
.artabs{display:flex;flex-wrap:wrap;gap:4px}
.artabs button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--ink3)}
.artabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.artabs .c{font-size:11px;color:var(--ink25);margin-left:4px}
.artabs button[aria-pressed="true"] .c{color:#C9C4D6}
.arlist{flex:1;min-height:0;overflow-y:auto;padding:6px 10px 10px}
.argrp{font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--ink4);padding:10px 10px 4px}
.arnote{font-size:12px;color:var(--ink4);padding:2px 10px 6px}
.arrow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:var(--r);padding:7px 10px;text-align:left;font-size:13.5px;color:var(--ink)}
.arrow:hover{background:var(--ground)}
.arrow.on{background:var(--accent-wash);color:var(--accent-ink)}
.arrow:disabled{cursor:default;background:none;color:var(--ink25)}
/* B53: a row already in the quiz is checked-and-disabled, not empty — the base .ck draws #fff on white */
.arrow:disabled>.ck{background:var(--ground);color:var(--ink4)}
.arrow .kd{font-size:10.5px;font-weight:600;color:var(--ink4);background:var(--ground);border-radius:var(--r-sm);padding:1px 6px}
.arrow .ct{margin-left:auto;font-size:12px;color:var(--ink4);white-space:nowrap}
.arrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arempty{padding:18px 10px;text-align:center;font-size:13px;color:var(--ink4)}
.arfoot{display:flex;align-items:center;gap:8px;padding:11px 14px 11px 20px;background:var(--ground);border-top:1px solid var(--rule)}
.arfoot span{flex:1;font-size:13px;color:var(--ink4)}
.arfoot .btn{padding:8px 14px;font-size:13.5px}
.tundo{border:0;background:none;color:#C9BFFF;font-weight:700;margin-left:10px;padding:0;pointer-events:auto}
@media (prefers-reduced-motion:no-preference){.tcard,.cell,.qi,.bk,.rc,.tpick,.ach,.mn{transition:background .12s,border-color .12s}}
/* ══ Delete a rule: a trash on hover in the rule lists, a faint trash column on the
   Table's Rules sheet, and "Delete rule" in the rule window. Every delete has Undo. ══ */
.xdel{display:inline-grid;place-items:center;width:22px;height:22px;flex:none}
.xl th.tact,.xl td.tact{width:34px;padding:3px 6px 0 0;text-align:right}
.tdel{display:inline-grid;place-items:center;width:26px;height:26px;border:1px solid transparent;border-radius:var(--r-sm);background:none;color:var(--ink25);padding:0}
.xl tr:hover .tdel{color:var(--ink4)}
.tdel:hover,.tdel:focus-visible{color:var(--crit);background:var(--crit-wash);border-color:var(--crit-line)}
.mdel{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:none;border-radius:var(--r-sm);padding:3px 8px;font-size:12.5px;font-weight:500;color:var(--ink4)}
.mdel:hover:not(:disabled),.mdel:focus-visible{color:var(--crit);background:var(--crit-wash);border-color:var(--crit-line)}
/* D11: Duplicate sits beside Delete rule in the window's top row — same shape, not the destructive
   colour, and dimmed while the rule on screen is one the window would refuse to save */
.mdup:hover:not(:disabled),.mdup:focus-visible{color:var(--accent-ink);background:var(--accent-wash);border-color:var(--accent-line)}
.mdup:disabled{color:var(--ink25);cursor:default}
/* ══ Save feedback on inline text edits: typing stays silent; once the edit is
   committed (Enter or click away) a small pill at the end of the text shows
   Saving… then Saved, then fades. It floats over the row, so nothing reflows. ══ */
#svb{position:fixed;z-index:30;display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px 0 6px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1;white-space:nowrap;pointer-events:none;transition:opacity .4s}
#svb.saving{background:var(--ground);color:var(--ink4)}
#svb.saved{background:var(--ok-wash);color:var(--ok)}
#svb.fade{opacity:0}
#svb .spin{width:10px;height:10px;border:1.5px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:svspin .7s linear infinite}
@keyframes svspin{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* ══ Question types — the live Questions step's vocabulary (TypeChipSelector):

   each. Once the first live rule is fully decided it catches that branch; if none is left, somebody gets

function picksFor(q,named){const out=[],other=q.answers.length-named.length,at=qIndex(q.id);

  for(let m=0;m<1<<named.length;m++){const s=named.filter((_,b)=>m>>b&1);if(skip&&!s.length||s.length<=mmax(q)&&s.length+other>=mmin(q))out.push(s)}

  const one=earlier.find(e=>walk(0,[e]));if(one)return [S.rules.indexOf(one)];

/* D9 (B6): ONE policy for every role. A question that gives up a job gives up what that job stored on
   its answers — whichever job it is. Moving "Picks results" clears both questions' recommendations (the
   locked rule), and leaving "Narrows" clears that question's values the same way, instead of parking
   them where nothing on the page can reach them and no Undo can offer them back. Both losses are named
   in the same toast and both come back with its one Undo. */
const roleLose=(q,k)=>k==="decides"?(S.qs.find(x=>x.role==="decides"&&x!==q)||null):(q.role==="decides"?q:null);

/* what leaving Narrows gives up: every value kept on an answer, and every "Keeps everything" */
const filtLose=(q,k)=>q.role==="filter"&&k!=="filter"?q:null;
const filtLossN=(q,k)=>filtLose(q,k)?q.answers.reduce((s,a)=>s+a.values.length+(a.any?1:0),0):0;

function findings(){
  const f=[];const dec=S.qs.find(q=>q.role==="decides");
  if(S.style==="attributes"){
    if(!dec)f.push({sv:"crit",act:"fixpick",t:"No question picks the result. Give one question that job."});
    else{const n=dec.answers.filter(a=>!a.targets.length).length;
      if(n)f.push({sv:"crit",q:dec.id,t:`Q${qIndex(dec.id)} · ${n} answer${n>1?"s have":" has"} no recommendation`});
      /* routes, walked forward from Q1: an answer that jumps past the deciding question leaves that shopper with no result (the publish gate's decider_bypass) */
      const d=S.qs.indexOf(dec),reach=new Set([0]);
      for(let i=0;i<d;i++){if(!reach.has(i))continue;const q=S.qs[i];q.answers.forEach(a=>{const n=a.route==="end"?Infinity:a.route?S.qs.findIndex(x=>x.id===a.route):i+1;
        if(n>d)f.push({sv:"crit",q:q.id,t:`Q${i+1} · “${escA(short(a.t))}” ${a.route==="end"?"goes straight to the results":`skips to Q${n+1}`} without answering Q${d+1}, the question that picks the result`});else reach.add(n)})}
      RECS.filter(r=>!recCovered(r.id)).forEach(r=>f.push({sv:"warn",q:dec.id,t:`“${escA(r.id)}” is never recommended`}));}
    /* an answer set to Keeps everything was chosen on purpose; only an unset one is reported */
    S.qs.filter(q=>q.role==="filter").forEach(q=>{const n=q.answers.filter(a=>!a.values.length&&!a.any).length;
      if(n)f.push({sv:"warn",q:q.id,t:`Q${qIndex(q.id)} · ${n} answer${n>1?"s keep":" keeps"} everything (no value chosen)`});});
  }else if(!S.rules.length)f.push({sv:"crit",t:"Rules only needs at least one rule to show anything."});
  /* D2 (R7): in Rules only a rule shows what it lists as soon as it can run, so the only way nothing
     shows is that no rule can run — "Add a Show rule" was advice for a verb this style does not have. */
  else{if(!S.rules.some((r,i)=>showsRecs(r,i)))f.push({sv:"crit",t:"None of your rules can ever run."});
    RECS.filter(r=>!recCovered(r.id)).forEach(r=>f.push({sv:"warn",t:`“${escA(r.id)}” is never recommended`}));}
  /* one flag per rule that can never run, the same one the lists show: no answers or recommendation left blocks (the rule window's own bar), the rest warn */
  S.rules.forEach((r,i)=>{const w=deadWhy(i);if(!w)return;const q=overQ(r);

}

/* B68: the per-answer "which rules touch this answer" badge was cut, so its scaffolding (rulesFor, lam)
   is gone with it, and the Rules-only branch of the role control is gone too — pane() only ever runs in
   Filter Results + Rules, where the control is always a real button. */
function pane(q){const r=roleOf(q);
  const rows=q.answers.map((a,i)=>{
    let cell;
    if(r==="decides"){cell=a.targets.length?a.targets.map(t=>`<span class="chipw"><span class="chip">${escA(t)}</span><span class="cn">${rec(t)?rec(t).n:"missing"}</span><button type="button" class="xone" aria-label="Remove ${escA(t)}" data-act="untarget" data-a="${i}" data-r="${escA(t)}">×</button></span>`).join(""):`<span class="vbtn">${S.armed?`Place ${escA(S.armed)} here`:"Choose a result"}<span class="cv">▾</span></span>`;
      cell=`<div class="cell${a.targets.length?"":" blank"}${S.armed?" drop":""}" role="button" tabindex="0" aria-haspopup="dialog" aria-expanded="false" data-act="cell" data-a="${i}">${cell}</div>`}
    else if(r==="filter"){cell=a.any?`<span class="chipw"><span class="chip all">Keeps everything</span><button type="button" class="xone" aria-label="Clear" data-act="unany" data-a="${i}">×</button></span>`
        :a.values.length?a.values.map(v=>{const m=VALMAP[v];return `<span class="chipw" title="${escA(SRC_NAME[m.src]+(m.attr&&m.src!=="type"?" · "+m.attr:""))}"><span class="chip">${escA(m.short)}</span><span class="cn">${m.n}</span><button type="button" class="xone" aria-label="Remove ${escA(m.short)}" data-act="unvalue" data-a="${i}" data-r="${escA(v)}">×</button></span>`}).join(""):`<span class="vbtn">Choose a value<span class="cv">▾</span></span>`;
      cell=`<div class="cell${a.values.length||a.any?"":" blank"}" role="button" tabindex="0" aria-haspopup="dialog" aria-expanded="false" data-act="cell" data-a="${i}">${cell}</div>`}
    else cell=`<div class="cell inert"><span class="dash">—</span></div>`;
    const gp=`aria-haspopup="menu" aria-expanded="false"`;
    const go=a.route?`<button type="button" class="go set" ${gp} data-act="route" data-a="${i}">→ ${a.route==="end"?"Results":"Q"+qIndex(a.route)}</button>`:`<button type="button" class="go" ${gp} data-act="route" data-a="${i}">→ ${isLastQ(q)?"Results":"Next"}</button>`;
    return `<div class="arow"><span class="akey${qtype(q)==="scale"?" num":""}">${akey(q,i)}</span><span class="atext">${ptEd(q,i,a)}${endCap(q,i)}</span><div>${cell}</div><div>${go}</div></div>`}).join("");
  const used=new Set(q.answers.flatMap(a=>a.targets));
  const tray=r==="decides"?`<div class="tray"><span class="tray-lb">Recommendations</span><div class="tray-c">${RECS.map(x=>`<button type="button" class="tchip${S.armed===x.id?" armed":""}${used.has(x.id)?" used":" fresh"}" data-fit title="${escA(x.id)} · ${x.n} products${used.has(x.id)?" · placed":""}" data-act="arm" data-r="${escA(x.id)}">${escA(x.id)}</button>`).join("")}<button type="button" class="tchip tmore" aria-haspopup="dialog" aria-expanded="false" data-more data-act="trayMore" hidden>+0 more</button></div></div>`:`<div class="prule"></div>`;
  const rb=`<button type="button" class="rolebtn" aria-haspopup="menu" aria-expanded="false" data-act="role">${BTN[r]} <span class="cv">▾</span></button>`;
  return `<div class="pane"><div class="paneh"><div class="phl"><h3><span class="ed" contenteditable="true" spellcheck="false" data-edit="q" data-q="${q.id}">${escA(q.text)}</span></h3>${typeBtn(q,"qtype")}</div>${rb}</div>${tray}<div class="arows">${rows}</div></div>`}

/* the empty state agrees with the check: without a question that picks the result, nothing decides anything yet */
function ruleRows(){if(!S.rules.length){const dec=S.qs.some(q=>q.role==="decides"),n=S.qs.filter(q=>roleOf(q)!=="info").length;return `<div class="rempty">No rules yet. ${dec?`Your <b>${n}</b> switched-on question${n===1?" is":"s are"} deciding everything.`:"No question picks the result yet, so nothing shows. Set one question to <b>Picks results</b>."}</div>`}
  return S.rules.map((r,i)=>{const t=deadTag(i);return `<div class="rrow${t?" dead":""}" data-act="editrule" data-i="${i}" title="Click to edit · use ↑ ↓ to reorder"><button type="button" class="rbody" data-act="editrule" data-i="${i}" title="Click to edit · use ↑ ↓ to reorder"><span class="rnum">${i+1}</span><span class="rsay"><span class="rsent">${sentence(r,true)}</span>${t}</span></button>${mvBtns(i,S.rules.length)}<button type="button" class="xone xdel" title="Delete rule" aria-label="Delete rule ${i+1}" data-act="delrule" data-i="${i}">${TRASH}</button></div>`}).join("")}

function statusHead(){return `<div class="status"><button type="button" class="stitle" aria-haspopup="menu" aria-expanded="false" title="Change how this quiz decides" data-act="stylemenu">${styleName()}<span class="cv" aria-hidden="true">▾</span></button><div class="sdesc">${hintHTML()}</div>${headRight()}</div>`}
function renderFilter(){if(S.view==="table")return fbar()+`<div class="work"><div class="card">${statusHead()}${tableHTML()}</div></div>`;const b=blocking();const c={decides:0,filter:0,info:0};S.qs.forEach(q=>c[roleOf(q)]++);
  return fbar()+`<div class="work"><div class="card">${statusHead()}<div class="grid3"><div class="rail"><div class="railhead"><span class="kick">Questions</span><span class="railn">${S.qs.length}</span></div>${railItems()}<div class="railcount"><span><i class="dot d"></i>${TAG.decides} ${c.decides}</span><span><i class="dot f"></i>${TAG.filter} ${c.filter}</span><span><i class="dot i"></i>${TAG.info} ${c.info}</span></div></div>${pane(curQ())}
<div class="rcol"><div class="rcol-in"><div class="rcol-h"><h4>Rules<span class="rcount">${S.rules.length}</span></h4><button type="button" class="btn pri" data-act="addrule">+ Add</button></div><p>Exceptions that run on top of the answers.</p><div class="rlistw"><div class="rlist">${ruleRows()}</div></div><div class="rcol-f"><button type="button" class="link" data-act="stub" data-m="Opens the existing Paste rules window">Paste rules</button></div></div></div></div></div></div>`}


/* ══ Rules only ══ */
function rulesBand(){const n=S.rules.length;
  const rows=S.rules.map((r,i)=>{const t=deadTag(i);
    return `<li class="rr${t?" dead":""}" draggable="true" data-ri="${i}" data-act="editrule" data-i="${i}" title="Click to edit · drag or use ↑ ↓ to reorder"><span class="grip" aria-hidden="true">⠿</span><button type="button" class="rbody" data-act="editrule" data-i="${i}" title="Click to edit · drag or use ↑ ↓ to reorder"><span class="rn">${i+1}</span><span class="rs"><span class="rsent">${sentence(r,true)}</span>${t}</span></button>${mvBtns(i,n)}<button type="button" class="xone xdel" title="Delete rule" aria-label="Delete rule ${i+1}" data-act="delrule" data-i="${i}">${TRASH}</button></li>`}).join("");
  return `<div class="rband">
${n?`<ol class="rlist2" aria-label="Rules, run top to bottom">${rows}</ol>`:`<div class="rempty2"><span><b>No rules yet.</b> In Rules only every result comes from a rule, so nothing shows until you create one.</span><button type="button" class="btn pri" data-act="addrule">Create your first rule</button></div>`}</div>`}

/* B49: a pill lights the rules that list it, so the pill has to say the same thing in text — and be
   reachable from the keyboard, which a plain span was not. */
const rulesListing=id=>S.rules.map((r,i)=>r.recs.includes(id)?i+1:0).filter(Boolean);
function vizRecs(){const done=RECS.filter(r=>ruleCount(r.id)).length;
  return `<div class="viz-h"><h3>Your recommendations</h3><span class="sub"><b>${done}/${RECS.length}</b> have a rule</span></div><div class="recrow">`+[...RECS].sort((a,b)=>(ruleCount(a.id)?1:0)-(ruleCount(b.id)?1:0)).map(r=>ruleCount(r.id)
      ?(x=>`<span class="rpill" data-fit data-r="${escA(r.id)}" tabindex="0" aria-label="${escA(r.id)} · ${x.length?`used by rule${x.length>1?"s":""} ${nlist(x)}`:"no rule uses it"}"><span class="sd on"></span>${escA(r.id)}</span>`)(rulesListing(r.id))
      :`<button type="button" class="rpill none" data-fit data-r="${escA(r.id)}" data-act="createFor"><span class="sd"></span>${escA(r.id)}<span class="add">+ Create a rule</span></button>`).join("")
    +`<button type="button" class="rpill add" aria-haspopup="dialog" aria-expanded="false" data-more data-act="stripMore" hidden>+0 more</button><button type="button" class="rpill add" data-act="addRecs">+ Add recommendations</button></div>`}

/* B62: the Rules column is pinned to the grid row, so it scrolls inside itself. The fade says there is
   more below (macOS overlay scrollbars say nothing), and the list keeps its place across a re-render
   instead of jumping back to rule 1 every time a question is selected or a rule is saved. */
function markRules(){const l=document.querySelector(".rcol .rlist");if(l)l.parentElement.classList.toggle("more",l.scrollHeight-l.clientHeight-l.scrollTop>4)}
/* an open check popover redraws with the current findings (its anchor going away closes it, as any popover's does) */
function render(){const k=document.querySelector(".rcol .rlist"),t=k?k.scrollTop:0;
  renderInner();
  const l=document.querySelector(".rcol .rlist");if(l){l.scrollTop=t;l.addEventListener("scroll",markRules,{passive:true})}
  markRules();fitRows();svPlace();paintLit();if(pop&&pop.build===checkPop)drawPop();else{placePop();popAria()}}
function renderInner(){
  $("#stage").innerHTML=S.style==="rules"?fbar()+`<div class="work"><div class="card">${statusHead()}${S.view==="table"?tableHTML():rulesBand()+`<div class="viz">${vizRecs()}</div>`}</div></div>`:renderFilter();
  /* R8: the artifact's own heading names the style on screen — it used to be frozen at "Rules only"
     above a card titled "Filter Results + Rules". Mock chrome, but it is the first line of the handoff. */
  $("#shellh1").textContent=`Logic step · ${styleName()}`;
  $("#pitch").textContent=S.style==="rules"?"Rules only: the rules are the page. Under them, the recommendations they point at and the ones still missing a rule.":"Filter Results + Rules, as it stands. Click the title to switch back to Rules only."}

/* ── Add recommendations ── */
const inQuiz=name=>RECS.some(r=>r.id===name);
/* B54: one match test feeds the list and the tab counts, so the tabs can't say "Tags 10" over 3 results */
function arHTML(){const q=AR.q.trim().toLowerCase(),hit=c=>!q||c.name.toLowerCase().includes(q),pool=CATALOG.filter(c=>(AR.tab==="all"||c.kind===AR.tab)&&hit(c));
  const count=k=>CATALOG.filter(c=>(k==="all"||c.kind===k)&&hit(c)).length;
  const row=c=>{const had=inQuiz(c.name),on=AR.sel.includes(c.name);
    return `<button type="button" class="arrow${on?" on":""}" role="checkbox" aria-checked="${on||had}" ${had?"disabled":""} data-act="arTog" data-n="${escA(c.name)}"><span class="ck">${on||had?"✓":""}</span><span class="nm">${escA(c.name)}</span>${AR.tab==="all"?`<span class="kd">${KIND[c.kind]}</span>`:""}<span class="ct">${had?"In this quiz":c.n===1?"1 product":c.n+" products"}</span></button>`};
  let list;
  if(!pool.length)list=`<div class="arempty">Nothing matches “${escA(AR.q)}”.</div>`;
  else if(AR.tab==="all")list=["collection","tag","product","group"].map(k=>{const g=pool.filter(c=>c.kind===k);return g.length?`<div class="argrp">${AR_TABS.find(t=>t[0]===k)[1]}</div>${g.map(row).join("")}`:""}).join("");
  else list=(AR.tab==="group"?`<div class="arnote">Groups you made on the Recommendations step.</div>`:"")+pool.map(row).join("");
  const n=AR.sel.length;
  return `<div class="arbox" role="dialog" aria-modal="true" aria-label="Add recommendations">
<div class="arhead"><h2>Add recommendations</h2><button type="button" class="mx" aria-label="Close" data-act="arClose">×</button></div>
<div class="artools"><input class="arsearch" id="ar-q" type="search" placeholder="Search products, collections, tags, groups" aria-label="Search" value="${escA(AR.q)}">
<div class="artabs" role="group" aria-label="Kind">${AR_TABS.map(([k,l])=>`<button type="button" aria-pressed="${AR.tab===k}" data-act="arTab" data-t="${k}">${l}<span class="c">${count(k)}</span></button>`).join("")}</div></div>
<div class="arlist">${list}</div>
<div class="arfoot"><span>${n?`<b>${n}</b> selected`:"Pick what shoppers could be shown"}</span><button type="button" class="btn" data-act="arClose">Cancel</button><button type="button" class="btn pri" data-act="arAdd"${n?"":" disabled"}>${n?`Add ${n} recommendation${n>1?"s":""}`:"Add recommendations"}</button></div></div>`}
/* B54: the window is built once when it opens; after that only the tabs, the list and the footer are
   swapped, so the search box is never replaced — its caret stays put and an IME composition survives.
   `top` says where the list should sit: a new query or tab passes 0 (results start at the top), ticking
   a row passes nothing and keeps the place. */
function drawAR(open,top){const el=$("#addrec"),was=!el.hidden;winOpening(el,!!AR);
  if(!AR){el.hidden=true;el.innerHTML="";winSync();placeToast();if(was)winRestore(el,'#stage [data-act="addRecs"]');return}
  const keep=!open&&el.querySelector(".arlist");if(top===undefined)top=keep?keep.scrollTop:0;el.hidden=false;
  /* the swap takes the focused row or tab with it, so ticking with the keyboard doesn't drop focus to the page */
  const a=document.activeElement,fk=keep&&a&&a.closest&&a.closest("#addrec")&&(a.dataset.n!==undefined?`[data-n="${CSS.escape(a.dataset.n)}"]`:a.dataset.t!==undefined?`[data-t="${CSS.escape(a.dataset.t)}"]`:"");
  if(keep){const t=document.createElement("template");t.innerHTML=arHTML();
    for(const c of ["artabs","arlist","arfoot"])el.querySelector("."+c).replaceWith(t.content.querySelector("."+c));
    if(fk){const f=el.querySelector(fk);if(f)f.focus({preventScroll:true})}}
  else{el.innerHTML=arHTML();if(open){const i=$("#ar-q");i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
  el.querySelector(".arlist").scrollTop=top;winSync();winFocusIn(el);placeToast()}

/* ══ Table view: the whole logic as a sheet. The export writes these same rows. ══ */
const IS_RULES_ROW=true;
/* B37: "a save is pending" lives here, not on the clicked button — any re-render swaps that node out */
let DL=null,XBUSY=false;(async()=>{try{if(!window.claude||!window.claude.use)return;DL=await window.claude.use("downloads");if(DL)render()}catch(e){DL=null}})();
const DOES={decides:"Picks results",filter:"Narrows",info:"Info only"};
/* B64: the last question has no next question, so an unset route there goes to the results */
const nextText=(a,q)=>!a.route?(q&&isLastQ(q)?"Results (last question)":"Next question"):a.route==="end"?"Straight to results":`Skips to Q${qIndex(a.route)}`;
/* D17: machine form here (Qn = answer). D12: a negated group means none of these answers, never "all of" */
function whenParts(r){return Object.keys(r.conds).filter(k=>r.conds[k].length).sort((a,b)=>qIndex(a)-qIndex(b)).map(k=>{const q=S.qs.find(x=>x.id===k);return{k,idx:r.conds[k],not:!!r.not[k],join:!r.not[k]&&r.all[k]?"and":"or",ans:r.conds[k].map(i=>ansMach(q,i))}})}
/* the export has no bold, so its joins are capitals; the table bolds the same capitals (R6) */
function whenText(r){const ps=whenParts(r);if(!ps.length)return "(no answers)";return ps.map(x=>(x.not?"NOT ":"")+(x.ans.length>1||x.not?`(${x.ans.join(` ${x.join.toUpperCase()} `)})`:x.ans[0])).join(" AND ")}
/* R6: the Table is captioned as the sheet the export writes, so its cell has to BE that cell — a
   merchant who copies one into the workbook must get a row Import accepts. The joins are the file's
   capitals (lowercase "and"/"or" are answer text to parseWhen, which is why " AND " is the token);
   only the weight is the Table's own. */
function whenHTML(r){const ps=whenParts(r);if(!ps.length)return "(no answers)";const cj=w=>` <b class="cj">${w}</b> `;return ps.map(x=>{const a=x.ans.map((t,j)=>`<span data-sq="${x.k}" data-sa="${x.idx[j]}" data-full="1">${escA(t)}</span>`);return (x.not?`<b class="cj">NOT</b> `:"")+(a.length>1||x.not?`(${a.join(cj(x.join.toUpperCase()))})`:a[0])}).join(cj("AND"))}
/* D16: the file carries identity as well as text, and writes nothing its own Import rejects —
   a name with a comma is quoted CSV-style, and an empty list is an empty cell, never "(none)"
   or "(not set)" (B23). The Table keeps its own copy in `cells`; `x` is what the file gets. */
const qName=n=>/[",]/.test(String(n))?'"'+String(n).replace(/"/g,'""')+'"':String(n);
const nameList=xs=>xs.map(qName).join(", ");
const whenX=r=>whenParts(r).length?whenText(r):"";
function sheets(){
  const verb=r=>VERBS.find(v=>v[0]===effVerb(r))[1];   // D2 (R7): the style's verb, the same one the rows read
  const rules={name:"Rules",cols:["#","What happens","Recommendations","When they answer"],widths:[5,14,26,80],
    xcols:["#","What happens","Recommendations","When they answer","Rule ID"],xwidths:[5,14,26,80,14],
    rows:S.rules.map((r,i)=>({cells:[i+1,verb(r),r.recs.join(", ")||"(none)",whenText(r)],x:[i+1,verb(r),nameList(r.recs),whenX(r),r.id],html3:whenHTML(r),act:"editrule",i,muted:!!deadWhy(i)}))};
  if(S.style==="rules"){
    const recs={name:"Recommendations",cols:["Recommendation","Products","Shown by rules","Status"],widths:[24,10,16,14],
      rows:RECS.map(r=>{const by=rulesShowing(r.id),has=by.length>0;return{cells:[r.id,r.n,by.join(", ")||"—",has?"Has a rule":"Needs a rule"],warn:!has,act:has?null:"createFor",r:r.id}})};
    return [rules,recs]}
  const answers={name:"Answers",cols:["Q","Question","Type","Answer","What it does","Shows / keeps","Then"],widths:[5,52,22,36,14,34,20],
    xcols:["Q","Question","Type","Answer","What it does","Shows / keeps","Then","Answer ID"],xwidths:[5,52,22,36,14,34,20,14],rows:[]};
  S.qs.forEach((q,qi)=>{const role=roleOf(q);q.answers.forEach((a,ai)=>{
    const val=role==="decides"?(a.targets.join(", ")||"(not set)"):role==="filter"?(a.any?"Keeps everything":a.values.map(v=>VALMAP[v].short).join(", ")||"(not set)"):"—";
    const xval=role==="decides"?nameList(a.targets):role==="filter"?(a.any?"Keeps everything":nameList(a.values.map(v=>VALMAP[v].short))):"";
    answers.rows.push({cells:[`Q${qi+1}`,q.text,typeMeta(q),a.t,DOES[role],val,nextText(a,q)],x:[`Q${qi+1}`,q.text,typeMeta(q),a.t,DOES[role],xval,nextText(a,q),a.aid],first:ai===0,role,unset:val==="(not set)",q:q.id,ai})})});
  return [rules,answers]}
function tableHTML(){return `<div class="tview">`+sheets().map(sh=>`<section class="tsheet"><div class="twrap"><table class="xl"><thead><tr>${sh.cols.map(c=>`<th>${c}</th>`).join("")}${sh.name==="Rules"?`<th class="tact"><span class="sr">Delete</span></th>`:""}</tr></thead><tbody>${sh.rows.length?sh.rows.map(r=>{const c=r.cells;let tds;
    if(sh.name==="Answers"){const q=S.qs.find(x=>x.id===r.q),a=q.answers[r.ai];
      tds=`<td class="k">${r.first?c[0]:""}</td><td class="qt">${r.first?`<span class="ed" contenteditable="true" spellcheck="false" data-edit="q" data-q="${q.id}">${escA(q.text)}</span>`:""}</td>`+
        `<td>${r.first?typeBtn(q,"tbtn dim"):""}</td>`+
        `<td>${isPt(q,r.ai)?`<b>${r.ai+1}</b> `:""}${ptEd(q,r.ai,a)}${endCap(q,r.ai)}</td>`+
        `<td>${r.first?`<button type="button" class="tbtn does ${r.role}" aria-haspopup="menu" aria-expanded="false" data-act="trole" data-q="${q.id}">${c[4]}<span class="cv">▾</span></button>`:""}</td>`+
        `<td>${r.role==="info"?`<span class="dim2">—</span>`:`<button type="button" class="tbtn${r.role==="decides"?" res":""}${r.unset?" unset":""}" aria-haspopup="dialog" aria-expanded="false" data-act="tval" data-q="${q.id}" data-a="${r.ai}">${escA(c[5])}<span class="cv">▾</span></button>`}</td>`+
        `<td><button type="button" class="tbtn dim" aria-haspopup="menu" aria-expanded="false" data-act="troute" data-q="${q.id}" data-a="${r.ai}">${c[6]}<span class="cv">▾</span></button></td>`}
    else if(sh.name==="Rules")tds=`<td class="k"><button type="button" class="tgob" data-act="editrule" data-i="${r.i}" aria-label="Edit rule ${r.i+1}">${c[0]}</button></td><td class="verb">${c[1]}</td><td class="res">${escA(c[2])}</td><td>${r.html3||c[3]}${deadTag(r.i)}</td><td class="tact">${r.act==="editrule"?`<button type="button" class="tdel" title="Delete rule" aria-label="Delete rule ${r.i+1}" data-act="delrule" data-i="${r.i}">${TRASH}</button>`:""}</td>`;
    else tds=`<td class="res">${r.act==="createFor"?`<button type="button" class="tgob" data-act="createFor" data-r="${escA(r.r)}" aria-label="Create a rule for ${escA(r.r)}">${escA(c[0])}</button>`:escA(c[0])}</td><td class="num">${c[1]}</td><td>${c[2]}</td><td class="${r.warn?"unset":"ok"}">${c[3]}</td>`;
    /* B48: the row stays clickable for a mouse, but it is not a tab stop with no role — the first cell
       carries the real button, so assistive tech sees a named control instead of a bare table row. */
    const go=r.act==="editrule"?` data-act="editrule" data-i="${r.i}"`:r.act==="createFor"?` data-act="createFor" data-r="${escA(r.r)}"`:"";
