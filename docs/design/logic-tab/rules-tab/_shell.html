<title>Rules &amp; map — 3 variations</title>
<style>
:root{
  --bg:#F5F5F8; --card:#FFFFFF; --wash:#F3F2F7; --wash2:#FAFAFC;
  --ink:#2A2438; --soft:#5A5470; --faint:#837D96; --faint2:#B4AEC6;
  --line:#E9E7EF; --line2:#F2F0F6; --bar:#E2DFEA;
  --ac:#6D5AE6; --ac-2:#5B49D4; --ac-s:#EEEBFC; --ac-d:#4A3AAF;
  --gold:#8A6224; --gold-s:#FBF0DE; --gold-bd:#DEC48E;
  --ok:#2E9B76; --ok-s:#E4F5EE;
  --bad:#BE3A31; --bad-s:#FBECEA;
  --t-gender:#3D5A9B; --t-gender-s:#E9EEF8;
  --t-fit:#1F7A6B;    --t-fit-s:#E2F2EF;
  --t-size:#8A5A12;   --t-size-s:#F8EFDE;
  --t-style:#96407A;  --t-style-s:#F8E9F3;
  --t-fabric:#3E7A32; --t-fabric-s:#E9F4E5;
  --t-price:#5B4CB8;  --t-price-s:#ECEAF9;
  --t-colour:#2B6C86; --t-colour-s:#E3F0F5;
  --t-season:#7A5330; --t-season-s:#F6EDE4;
  --t-incoll:#6B5B95; --t-incoll-s:#EEEBF6;
  --t-any:#8A85A0;    --t-any-s:#F2F1F6;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:22px;--s6:30px;
  --rx:4px;--r1:6px;--r2:9px;--r3:12px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Quicksand","Mona Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sh:0 1px 2px rgba(42,36,56,.04),0 3px 10px rgba(42,36,56,.05);
  --shbig:0 24px 70px -20px rgba(42,36,56,.4),0 2px 8px rgba(42,36,56,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16141C;--card:#1E1B26;--wash:#232030;--wash2:#1A1823;
  --ink:#EFEDF5;--soft:#B6B0C8;--faint:#8E88A4;--faint2:#645E78;
  --line:#302C3D;--line2:#282435;--bar:#3A3549;
  --ac:#9484F5;--ac-2:#A99CF8;--ac-s:#272141;--ac-d:#BBB0FA;
  --gold:#D3A45E;--gold-s:#2D2416;--gold-bd:#5C4826;
  --ok:#4FC79C;--ok-s:#16302A;--bad:#E8817A;--bad-s:#33201F;
  --t-gender:#8FA8E0;--t-gender-s:#1E2436;--t-fit:#5FC0AC;--t-fit-s:#152A27;
  --t-size:#D6A65C;--t-size-s:#2C2416;--t-style:#DC8AC1;--t-style-s:#2E1C29;
  --t-fabric:#84C377;--t-fabric-s:#1B2A18;--t-price:#A79AF0;--t-price-s:#232040;
  --t-colour:#6FB4CE;--t-colour-s:#152730;--t-season:#C39A72;--t-season-s:#2A2119;
  --t-incoll:#A99AD0;--t-incoll-s:#242038;--t-any:#8E88A4;--t-any-s:#252231;
  --sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  --shbig:0 30px 80px -20px rgba(0,0,0,.85),0 2px 10px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#16141C;--card:#1E1B26;--wash:#232030;--wash2:#1A1823;
  --ink:#EFEDF5;--soft:#B6B0C8;--faint:#8E88A4;--faint2:#645E78;
  --line:#302C3D;--line2:#282435;--bar:#3A3549;
  --ac:#9484F5;--ac-2:#A99CF8;--ac-s:#272141;--ac-d:#BBB0FA;
  --gold:#D3A45E;--gold-s:#2D2416;--gold-bd:#5C4826;
  --ok:#4FC79C;--ok-s:#16302A;--bad:#E8817A;--bad-s:#33201F;
  --t-gender:#8FA8E0;--t-gender-s:#1E2436;--t-fit:#5FC0AC;--t-fit-s:#152A27;
  --t-size:#D6A65C;--t-size-s:#2C2416;--t-style:#DC8AC1;--t-style-s:#2E1C29;
  --t-fabric:#84C377;--t-fabric-s:#1B2A18;--t-price:#A79AF0;--t-price-s:#232040;
  --t-colour:#6FB4CE;--t-colour-s:#152730;--t-season:#C39A72;--t-season-s:#2A2119;
  --t-incoll:#A99AD0;--t-incoll-s:#242038;--t-any:#8E88A4;--t-any-s:#252231;
  --sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  --shbig:0 30px 80px -20px rgba(0,0,0,.85),0 2px 10px rgba(0,0,0,.5);
}
:root[data-theme="light"]{
  --bg:#F5F5F8;--card:#FFFFFF;--wash:#F3F2F7;--wash2:#FAFAFC;
  --ink:#2A2438;--soft:#5A5470;--faint:#837D96;--faint2:#B4AEC6;
  --line:#E9E7EF;--line2:#F2F0F6;--bar:#E2DFEA;
  --ac:#6D5AE6;--ac-2:#5B49D4;--ac-s:#EEEBFC;--ac-d:#4A3AAF;
  --gold:#8A6224;--gold-s:#FBF0DE;--gold-bd:#DEC48E;
  --ok:#2E9B76;--ok-s:#E4F5EE;--bad:#BE3A31;--bad-s:#FBECEA;
  --t-gender:#3D5A9B;--t-gender-s:#E9EEF8;--t-fit:#1F7A6B;--t-fit-s:#E2F2EF;
  --t-size:#8A5A12;--t-size-s:#F8EFDE;--t-style:#96407A;--t-style-s:#F8E9F3;
  --t-fabric:#3E7A32;--t-fabric-s:#E9F4E5;--t-price:#5B4CB8;--t-price-s:#ECEAF9;
  --t-colour:#2B6C86;--t-colour-s:#E3F0F5;--t-season:#7A5330;--t-season-s:#F6EDE4;
  --t-incoll:#6B5B95;--t-incoll-s:#EEEBF6;--t-any:#8A85A0;--t-any-s:#F2F1F6;
  --sh:0 1px 2px rgba(42,36,56,.04),0 3px 10px rgba(42,36,56,.05);
  --shbig:0 24px 70px -20px rgba(42,36,56,.4),0 2px 8px rgba(42,36,56,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:600 13px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 70px;min-width:0}
html,body{max-width:100%;overflow-x:hidden}

/* ---------- variation switcher ---------- */
.top{text-align:center;margin-bottom:var(--s5)}
.top .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:700}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:var(--s2) 0 6px}
.top p{font-size:13px;color:var(--soft);max-width:62ch;margin:0 auto}
.vsw{display:flex;justify-content:center;margin:var(--s5) 0 var(--s4)}
.vsw .seg{display:inline-flex;background:var(--wash);border-radius:var(--r3);padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.vsw button{border:0;background:none;color:var(--faint);font-size:12.5px;font-weight:700;
  padding:8px 15px;border-radius:10px;white-space:nowrap}
.vsw button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.vnote{background:var(--ac-s);border-radius:var(--r2);padding:10px var(--s4);font-size:12.5px;
  color:var(--ink);line-height:1.55;margin-bottom:var(--s4);text-align:center}
.vnote b{color:var(--ac-d)}
.pane{display:none} .pane.on{display:block}

/* ---------- rules card (top of the page) ---------- */
.rcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r3);
  box-shadow:var(--sh);overflow:hidden}
.rch{display:flex;align-items:center;gap:10px;padding:9px var(--s4) 9px var(--s5);flex-wrap:wrap}
.rch h2{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.rch .sub{font-size:12.5px;color:var(--faint);font-weight:600}
.rch .spark{margin-right:auto}
.rrow{display:flex;align-items:center;gap:10px;padding:7px var(--s5);
  border-top:1px solid var(--line2);font-size:12.5px;line-height:1.45}
.rrow:hover{background:var(--wash2)}
.rrow .no{width:20px;height:20px;flex:0 0 auto;border-radius:6px;background:var(--wash);
  color:var(--faint);font-family:var(--mono);font-size:9.5px;font-weight:700;
  display:grid;place-items:center}
.rrow .txt{flex:1;min-width:0}
.rrow .txt b{font-weight:700}
.rrow .txt i{font-style:normal;color:var(--faint2);font-size:11px}
.rrow .kill{border:0;background:none;color:var(--faint2);font-size:12.5px;padding:1px 5px;border-radius:var(--rx)}
.rrow .kill:hover{color:var(--bad);background:var(--bad-s)}
.rrow.fresh{animation:fl 1.6s ease-out}
@keyframes fl{0%{background:var(--ac-s)}100%{background:transparent}}
.rrow.none{color:var(--faint)}
.join{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);background:var(--wash);
  border-radius:var(--rx);padding:2px 5px;margin:0 3px;vertical-align:1px}
.mkbtn{display:inline-flex;align-items:center;gap:5px;background:var(--ac);color:#fff;border:0;
  border-radius:8px;padding:6px 12px;font-size:11.5px;font-weight:700;margin-left:auto;
  box-shadow:0 1px 6px -2px rgba(109,90,230,.55)}
.mkbtn:hover{background:var(--ac-2)}
.mkbtn .p{font-size:13px;line-height:1;margin-top:-1px}

/* ---------- map ---------- */
.mapcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r3);
  box-shadow:var(--sh);overflow:hidden;margin-top:var(--s4)}
.mh2{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5);flex-wrap:wrap}
.mh2 h2{font-size:15px;font-weight:700}
.mh2 .sub{font-size:12.5px;color:var(--faint);font-weight:600;flex:1;min-width:120px}
/* fixed layout: removing a tag chip must never resize the columns around it */
.mtbl{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.mtbl td.nar{width:36%}
.mtbl td.at{width:auto}
.mtbl th{text-align:left;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint2);font-weight:700;padding:7px var(--s3);border-top:1px solid var(--line);
  border-bottom:1px solid var(--line2);background:var(--wash2);white-space:nowrap}
.mtbl td{padding:5px var(--s3);border-bottom:1px solid var(--line2);vertical-align:middle}
.mtbl tr:last-child td{border-bottom:0}
.mtbl td.q{font-weight:700;color:var(--ink);border-right:2px solid var(--bar);
  background:var(--wash2);vertical-align:top;padding-top:9px;width:180px}
.mtbl td.q .qr{font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);font-weight:700;display:block;margin-top:3px}
.mtbl td.ak{width:26px;color:var(--faint2);font-family:var(--mono);font-size:10px;text-align:center}
.mtbl td.at{font-weight:600}
.mtbl td.cn{text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--soft);
  white-space:nowrap;width:96px}
.mtbl td.cn s{text-decoration:none;color:var(--faint2)}
.mtbl td.cn.bad{color:var(--bad)}
.mtbl td.go{width:132px}
.mtbl td.go .mapbtn{font-size:11px;padding:3px 8px;min-height:0}
/* each question is a block — the divide between them carries weight */
.mtbl tr.qs td{border-top:2px solid var(--bar)}
.mtbl tr.qs:first-of-type td{border-top:1px solid var(--line)}
.mtbl tr.info td{color:var(--faint);font-size:11.5px}
.t{display:inline-flex;align-items:center;border-radius:var(--rx);padding:2px 7px;
  font-size:11px;font-weight:700;color:var(--tc);background:var(--tbg);margin:1px 3px 1px 0;white-space:nowrap}
.sdot{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rref{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;
  background:var(--gold-s);color:var(--gold);border:1px solid var(--gold-bd);
  border-radius:99px;padding:1px 6px;margin-right:3px}

/* ---------- A: the switch bar ---------- */
.swbar{display:flex;align-items:center;gap:var(--s3);background:var(--card);
  border:1px dashed var(--bar);border-radius:var(--r3);padding:var(--s4) var(--s5);
  margin-top:var(--s4);flex-wrap:wrap}
.swbar .t1{font-size:14px;font-weight:700}
.swbar .t2{font-size:12.5px;color:var(--faint);flex:1;min-width:200px;line-height:1.5}
.swbtn{display:inline-flex;align-items:center;gap:9px;background:var(--wash);border:1px solid var(--line);
  border-radius:99px;padding:7px 14px 7px 7px;font-size:12.5px;font-weight:700;white-space:nowrap}
.swbtn .knob{width:34px;height:20px;border-radius:99px;background:var(--bar);position:relative;flex:0 0 auto;transition:.16s}
.swbtn .knob:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;
  border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.swbtn.on{background:var(--ac-s);border-color:transparent;color:var(--ac-d)}
.swbtn.on .knob{background:var(--ac)} .swbtn.on .knob:after{left:16px}

/* ---------- B: questions inside the same list ---------- */
.divrow{display:flex;align-items:center;gap:var(--s3);padding:11px var(--s5);
  border-top:1px solid var(--line);background:var(--wash2)}
.divrow .dl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
.divrow .dh{font-size:11.5px;color:var(--faint2);flex:1}
.qrow{display:flex;align-items:center;gap:10px;padding:8px var(--s5);
  border-top:1px solid var(--line2);font-size:13px}
.qrow:hover{background:var(--wash2)}
.qrow .qn{width:24px;height:24px;flex:0 0 auto;border-radius:7px;background:var(--wash);
  color:var(--faint);font-family:var(--mono);font-size:10px;font-weight:700;display:grid;place-items:center}
.qrow .ql{flex:1;min-width:0}
.qrow .ql b{font-weight:700}
.qrow .st{font-size:11.5px;color:var(--faint);font-weight:600}
.qrow .act{border:1px solid var(--line);background:var(--card);border-radius:99px;
  padding:5px 12px;font-size:11.5px;font-weight:700;color:var(--soft);white-space:nowrap}
.qrow .act:hover{border-color:var(--ac);color:var(--ac-d)}
/* a switched-on question is marked by a rail, not a wash — seven tinted rows
   in a row reads as noise, and the buttons then have to shout over it */
.qrow{border-left:3px solid transparent}
.qrow.on{border-left-color:var(--ac);background:var(--wash2)}
.qrow.on .ql b{color:var(--ink)}
.qrow .act{background:var(--card)}
.qrow .act:hover{border-color:var(--ac);color:var(--ac-d);background:var(--card)}
.qexp{border-top:1px solid var(--line2);background:var(--wash2);padding:var(--s3) var(--s5) var(--s4) 62px}
.qexp .er{display:flex;align-items:center;gap:var(--s3);padding:5px 0;font-size:12.5px}
.qexp .er .an{width:120px;font-weight:600}
.qexp .er .cn{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}

/* ---------- C: coverage ---------- */
.segh{display:flex;gap:2px;background:var(--wash);border-radius:10px;padding:3px}
.segh button{border:0;background:none;color:var(--faint);font-size:12px;font-weight:700;
  padding:6px 13px;border-radius:7px;white-space:nowrap}
.segh button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.covwrap{padding:var(--s4) var(--s5) var(--s5)}
.covhero{display:flex;align-items:baseline;gap:var(--s3);padding-bottom:var(--s4);
  border-bottom:1px solid var(--line2);margin-bottom:var(--s4);flex-wrap:wrap}
.covhero .big{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.covhero .big.bad{color:var(--bad)} .covhero .big.ok{color:var(--ok)}
.covhero .lb{font-size:13px;color:var(--soft);line-height:1.45;flex:1;min-width:200px}
.gap{display:flex;align-items:center;gap:var(--s3);padding:10px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.gap:last-child{border-bottom:0}
.gap .gt{flex:1;min-width:200px;font-size:13px;line-height:1.5}
.gap .gp{font-family:var(--mono);font-size:11.5px;color:var(--faint);white-space:nowrap}
.gbtn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;
  font-size:11.5px;font-weight:700;color:var(--soft);white-space:nowrap}
.gbtn:hover{border-color:var(--ac);color:var(--ac-d)}
.gbtn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.gbtn.pri:hover{background:var(--ac-2)}

/* =====================================================================
   THE MODAL — full-bleed, three columns
   ===================================================================== */
#scrim{position:fixed;inset:0;background:rgba(30,25,45,.5);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:.16s;z-index:60}
#scrim.on{opacity:1;pointer-events:auto}
#modal{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-48%) scale(.99);
  width:min(1160px,95vw);height:min(720px,88vh);background:var(--card);
  border-radius:18px;box-shadow:var(--shbig);display:none;flex-direction:column;overflow:hidden}
#modal.on{display:flex;transform:translate(-50%,-50%) scale(1)}
.mhd{display:flex;align-items:center;gap:var(--s3);padding:13px var(--s5);
  border-bottom:1px solid var(--line)}
.mhd h2{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.mhd .hint{font-size:11.5px;color:var(--faint);flex:1;min-width:0}
.mhd .mbtn{margin-left:auto;flex:0 0 auto}
.mx{border:0;background:none;color:var(--faint2);font-size:17px;padding:4px 8px;border-radius:var(--r1)}
.mx:hover{background:var(--wash);color:var(--ink)}
.mbody{flex:1;min-height:0;display:grid;grid-template-columns:1fr 182px 1fr}
@media(max-width:900px){.mbody{grid-template-columns:1fr;overflow-y:auto}}
.bank{display:flex;flex-direction:column;min-height:0;min-width:0}
.bank+.bank{border-left:1px solid var(--line)}
.bankh{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4) var(--s2)}
.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:700}
.count{margin-left:auto;font-size:11px;font-weight:700;background:var(--ac-s);color:var(--ac-d);
  border-radius:99px;padding:3px 9px;white-space:nowrap}
.count.none{background:var(--wash);color:var(--faint2)}
.bankb{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 var(--s4) var(--s4)}
.spine{border-left:1px solid var(--line);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-width:0;background:var(--wash2)}
.spine .bankh{justify-content:center}
.verbs{display:grid;gap:7px;width:100%;padding:0 11px var(--s4);margin:auto 0}
.verb{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:9px 11px}
.verb b{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--soft);margin-bottom:3px}
.verb i{display:block;font-style:normal;font-size:10.5px;color:var(--faint2);line-height:1.35}
.verb:hover{border-color:var(--faint2)}
.verb.on{border-color:var(--ac);background:var(--ac-s);box-shadow:0 0 0 1px var(--ac)}
.verb.on b{color:var(--ac-d)} .verb.on i{color:var(--ac-2)}
.verb:hover b{color:var(--ink)}

.qblock{padding:6px 0}
.qhead{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.qnum{font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--faint);
  background:var(--wash);border-radius:var(--rx);padding:2px 5px;flex:0 0 auto}
.qlab{font-size:10px;font-weight:700;color:var(--faint2);letter-spacing:.06em;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qblock.used .qnum{background:var(--ac-s);color:var(--ac-d)}
.qmulti{font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  color:var(--faint2);background:var(--wash);border-radius:var(--rx);padding:2px 5px}
.qmode{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--faint);margin-left:auto}
.mini{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:2px 8px;
  font-size:10.5px;font-weight:700;color:var(--faint)}
.mini.on{background:var(--ac);border-color:var(--ac);color:#fff}
